<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#f5f7fb">
  <link rel="icon" href="QuoteDesk.ico" type="image/x-icon">
  <title>QuoteDesk - Simple quotations</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17243b;
      --muted: #77839a;
      --line: #e5eaf2;
      --canvas: #f5f7fb;
      --paper: #ffffff;
      --blue: #315ee8;
      --blue-dark: #2449c8;
      --blue-pale: #eef2ff;
      --green: #18855b;
      --red: #c84444;
      --shadow: 0 12px 36px rgba(23, 36, 59, .07);
      font-family: Inter, "Segoe UI", Arial, sans-serif;
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; overflow-x: hidden; color: var(--ink); background: linear-gradient(180deg, #f8faff 0, #f3f6fb 320px, #f6f8fc 100%); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .app-shell:not(.is-authenticated) { display: none !important; }
    .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #edf3ff 0%, #f8faff 48%, #e9f5ef 100%); }
    body.authenticated .login-screen { display: none; }
    .login-card { width: min(100%, 430px); padding: 32px; border: 1px solid #dce5f2; border-radius: 22px; background: rgba(255,255,255,.97); box-shadow: 0 24px 60px rgba(42,69,114,.14); }
    .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .login-brand img { width: 74px; height: 47px; object-fit: contain; }
    .login-brand strong { display: block; font-size: 19px; letter-spacing: -.35px; }
    .login-brand span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
    .login-card h1 { font-size: 28px; }
    .login-card .subtitle { margin-bottom: 22px; }
    .login-fields { display: grid; gap: 14px; }
    .login-fields input { min-height: 44px; padding: 11px 12px; }
    .remember-option { display: flex; align-items: center; gap: 9px; margin: 3px 0 2px; color: #4f5e75; font-size: 12px; font-weight: 650; cursor: pointer; }
    .remember-option input { width: 17px; height: 17px; accent-color: var(--blue); }
    .login-error { min-height: 18px; margin: 12px 0 0; color: #bb3939; font-size: 11px; font-weight: 650; }
    .login-footnote { margin: 16px 0 0; color: #8390a5; font-size: 10px; line-height: 1.5; }
    .app-shell { width: 100%; min-height: 100vh; display: grid; grid-template-columns: 224px minmax(0, 1fr); overflow-x: hidden; }
    .sidebar {
      background: rgba(255,255,255,.96); border-right: 1px solid #e0e7f1; padding: 25px 14px 18px;
      display: flex; flex-direction: column; gap: 30px;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; }
    .brand-mark {
      width: 58px; height: 36px; border-radius: 7px; display: grid; place-items: center;
      flex: none; overflow: hidden; background: #fff;
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand-name { font-size: 16px; font-weight: 750; letter-spacing: -.35px; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .nav-label { margin: 0 11px 9px; color: #a0a8b8; font-size: 10px; font-weight: 750; letter-spacing: 1.25px; text-transform: uppercase; }
    .nav-list { display: grid; gap: 5px; }
    .nav-button {
      display: flex; align-items: center; gap: 12px; width: 100%; border: 0; border-radius: 10px;
      padding: 11px 12px; text-align: left; color: #66728a; background: transparent; font-size: 13px; font-weight: 650;
    }
    .nav-button:hover { background: #f6f8fc; color: var(--ink); }
    .nav-button.active { color: var(--blue); background: var(--blue-pale); }
    .nav-icon { width: 19px; text-align: center; font-size: 17px; line-height: 1; }
    .sidebar-bottom { margin-top: auto; padding: 13px 11px 2px; border-top: 1px solid var(--line); }
    .local-note { display: flex; align-items: center; gap: 8px; color: #77839a; font-size: 11px; line-height: 1.5; }
    .local-dot { width: 7px; height: 7px; border-radius: 50%; background: #27aa71; box-shadow: 0 0 0 3px #e9f7f0; flex: none; }
    .app-main { min-width: 0; }
    .topbar {
      height: 72px; padding: 0 32px; background: rgba(255,255,255,.88); border-bottom: 1px solid #e0e7f1;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .breadcrumbs { color: var(--muted); font-size: 12px; }
    .breadcrumbs strong { color: var(--ink); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 10px; }
    .save-hint { display: flex; align-items: center; gap: 7px; color: #77839a; font-size: 11px; }
    .save-hint span { color: var(--green); font-size: 14px; }
    .page-wrap { width: min(1660px, 100%); margin: 0 auto; padding: 30px 32px 56px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 7px; color: var(--blue); font-size: 10px; font-weight: 800; letter-spacing: 1.25px; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(23px, 3vw, 29px); letter-spacing: -.75px; line-height: 1.15; }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .button {
      min-height: 39px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      border: 1px solid var(--line); border-radius: 9px; padding: 0 14px; color: #394760;
      background: #fff; font-size: 12px; font-weight: 700; transition: .15s ease;
    }
    .button:hover { border-color: #c9d2e3; background: #fafbfe; transform: translateY(-1px); }
    .button.primary { border-color: var(--blue); color: #fff; background: var(--blue); box-shadow: 0 5px 12px #315ee825; }
    .button.primary:hover { border-color: var(--blue-dark); background: var(--blue-dark); }
    .button.soft { color: var(--blue); border-color: #dfe6ff; background: #f7f8ff; }
    .button.danger { color: var(--red); }
    .button.small { min-height: 32px; padding: 0 10px; font-size: 11px; }
    .button.wide { width: 100%; }
    /* The editor and preview are separate flex columns: neither can overlap the other. */
    .workbench { display: flex; align-items: flex-start; gap: 24px; width: 100%; }
    .workbench > * { min-width: 0; }
    .editor { display: grid; flex: 0 1 790px; gap: 15px; min-width: 0; width: min(100%, 790px); }
    .workbench > .preview-wrap { position: static !important; flex: 1 1 0; align-self: flex-start; min-width: 0; width: auto !important; max-width: none; max-height: none; overflow: hidden; }
    .card { background: rgba(255,255,255,.98); border: 1px solid #e0e7f1; border-radius: 16px; box-shadow: 0 10px 28px rgba(38,59,91,.055); }
    .form-card { padding: 19px 20px 20px; }
    .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .card-title { margin: 0; font-size: 13px; font-weight: 750; letter-spacing: -.1px; }
    .card-caption { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .step-number {
      width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px;
      color: var(--blue); background: var(--blue-pale); font-size: 11px; font-weight: 800; flex: none;
    }
    .section-label { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 11px 12px; }
    .fields.three { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .field { min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 5px; color: #59657b; font-size: 10px; font-weight: 700; }
    input, textarea, select {
      width: 100%; min-width: 0; border: 1px solid #e1e6ef; border-radius: 8px; outline: none;
      padding: 9px 10px; color: var(--ink); background: #fff; font-size: 12px; transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder, textarea::placeholder { color: #aab2c0; }
    input:focus, textarea:focus, select:focus { border-color: #9aafff; box-shadow: 0 0 0 3px #315ee813; }
    textarea { min-height: 86px; resize: vertical; line-height: 1.5; }
    .input-prefix { position: relative; }
    .input-prefix span { position: absolute; top: 50%; left: 10px; color: #8b96a9; font-size: 12px; transform: translateY(-50%); pointer-events: none; }
    .input-prefix input { padding-left: 26px; }
    .business-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 11px; border: 1px solid #e7ecf4; border-radius: 9px; background: #fafbfe; }
    .business-name { overflow: hidden; color: #3d4a62; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .business-sub { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .text-button { border: 0; padding: 3px; color: var(--blue); background: transparent; font-size: 11px; font-weight: 750; white-space: nowrap; }
    .text-button:hover { text-decoration: underline; }
    .item-table-wrap { overflow-x: auto; }
    .item-table { width: 100%; border-collapse: collapse; min-width: 850px; }
    .item-table th { padding: 0 5px 8px; color: #8893a7; text-align: left; font-size: 9px; font-weight: 750; letter-spacing: .3px; text-transform: uppercase; }
    .item-table td { padding: 4px; vertical-align: top; }
    .item-table input { padding: 8px 8px; font-size: 11px; }
    .item-table .name-cell { min-width: 142px; }
    .item-table .spec-cell { min-width: 125px; }
    .item-table .code-cell { width: 70px; }
    .item-table .image-cell { width: 68px; }
    .item-table .qty-cell { width: 56px; }
    .item-table .rate-cell { width: 84px; }
    .item-table .discount-cell { width: 92px; }
    .item-table .gst-cell { width: 62px; }
    .item-table .amount-cell { width: 80px; padding: 12px 4px 0; color: #3e4d67; font-size: 11px; font-weight: 700; white-space: nowrap; }
    .row-discount-wrap { display: flex; align-items: center; gap: 3px; }
    .row-discount-wrap input { min-width: 44px; flex: 1; padding: 8px 5px !important; }
    .row-discount-wrap select {
      padding: 7px 2px; font-size: 11px; font-weight: 750; width: 36px;
      border: 1px solid var(--line); border-radius: 6px; background: #f8faff; color: #3e4d67;
      cursor: pointer;
    }
    .row-discount-wrap select:focus { border-color: var(--blue); outline: none; }
    .item-table .remove-cell { width: 28px; padding-top: 7px; }
    .image-select {
      position: relative; width: 54px; height: 46px; display: grid; place-items: center; overflow: hidden;
      border: 1px dashed #cad4e6; border-radius: 7px; color: #8290a8; background: #fafbff; cursor: pointer;
    }
    .image-select:hover { border-color: #8fa6ff; background: #f4f6ff; }
    .image-select img { width: 100%; height: 100%; object-fit: contain; background: #fff; }
    .image-select span { display: grid; justify-items: center; font-size: 16px; line-height: 1; }
    .image-select small { margin-top: 3px; font-size: 8px; }
    .image-select input { position: absolute; inset: 0; width: 100%; height: 100%; padding: 0; opacity: 0; cursor: pointer; }
    .icon-button { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; color: #929db0; background: transparent; font-size: 16px; }
    .icon-button:hover { color: var(--red); background: #fff1f1; }
    .item-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; }
    .item-tip { color: #98a2b3; font-size: 10px; }
    .catalog-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 13px; }
    .catalog-toolbar input[type="search"] { width: min(320px, 100%); margin-right: auto; }
    .catalog-table-wrap { overflow-x: auto; }
    .catalog-table { width: 100%; min-width: 790px; border-collapse: collapse; }
    .catalog-table th { padding: 0 5px 8px; color: #8893a7; text-align: left; font-size: 9px; font-weight: 750; letter-spacing: .3px; text-transform: uppercase; }
    .catalog-table td { padding: 4px; vertical-align: middle; }
    .catalog-table input { padding: 8px; font-size: 11px; }
    .catalog-table .catalog-spec { min-width: 190px; }
    .catalog-table td:first-child { min-width: 115px; }
    .catalog-table td:nth-child(2) { min-width: 165px; }
    .catalog-table td:nth-child(5) { min-width: 115px; }
    .catalog-table td:nth-child(6) { min-width: 85px; }
    .catalog-table .catalog-photo { width: 58px; height: 48px; }
    .catalog-help { margin: -5px 0 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .catalog-empty { padding: 25px 12px; color: var(--muted); text-align: center; font-size: 12px; }
    .catalog-match { color: var(--green); font-size: 9px; font-weight: 700; }
    .product-picker { position: fixed; z-index: 10000; overflow-y: auto; padding: 5px; border: 1px solid #dce3ef; border-radius: 11px; background: #fff; box-shadow: 0 16px 40px rgba(23,36,59,.18); }
    .catalog-search-wrap { min-width: 0; }
    .product-option { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; align-items: center; gap: 10px; width: 100%; min-height: 56px; border: 0; border-radius: 8px; padding: 7px; text-align: left; color: var(--ink); background: #fff; }
    .product-option:hover, .product-option.active { background: #f2f5ff; }
    .product-option img, .product-option-photo { width: 42px; height: 42px; display: grid; place-items: center; overflow: hidden; border: 1px solid var(--line); border-radius: 7px; color: #9aa4b4; background: #fafbfe; object-fit: contain; }
    .product-option-name { display: block; overflow: hidden; font-size: 11px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .product-option-detail { display: block; overflow: hidden; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
    .product-option-price { color: #334563; font-size: 10px; font-weight: 750; white-space: nowrap; }
    .product-picker-empty { padding: 15px 12px; color: var(--muted); text-align: center; font-size: 11px; line-height: 1.5; }
    .storage-path-list { display: grid; gap: 9px; margin-top: 13px; }
    .storage-path-row { display: grid; grid-template-columns: 112px minmax(0,1fr); align-items: start; gap: 10px; font-size: 11px; line-height: 1.45; }
    .storage-path-row strong { color: #46536a; }
    .storage-path-row span { color: var(--muted); overflow-wrap: anywhere; }
    .charge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
    .charges-divider { grid-column: 1 / -1; border-top: 1px dashed var(--line); margin: 2px 0; }
    .tax-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .helper { margin: 5px 0 0; color: #98a2b3; font-size: 9px; line-height: 1.4; }
    .bottom-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 4px 0; }
    .action-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .preview-wrap { position: static; min-width: 0; width: 100%; padding: 16px; border: 1px solid #dbe4f0; border-radius: 18px; background: rgba(255,255,255,.76); box-shadow: 0 10px 30px rgba(38,59,91,.06); }
    #print-preview { display: none; }
    .preview-heading { display: flex; justify-content: space-between; align-items: center; margin: 1px 2px 13px; }
    .preview-heading strong { color: #30486b; font-size: 12px; }
    .preview-heading span { color: #9aa4b4; font-size: 10px; }
    .quote-preview-pages { display: grid; gap: 14px; width: 100%; color: #171717; font-family: Arial, "Segoe UI", sans-serif; }
    /* 794 × 1123 CSS pixels is an A4 sheet at standard screen density. */
    .quote-page { box-sizing: border-box; width: min(100%, 794px); min-width: 0; max-width: 100%; min-height: 0; aspect-ratio: 210 / 297; margin: 0 auto; padding: clamp(12px, 1.3vw, 21px); overflow: hidden; border: 1px solid #d8dce2; border-radius: 8px; background: #fff; box-shadow: var(--shadow); }
    .quote-letterhead { display: grid; grid-template-columns: 27% minmax(0, 1fr); align-items: center; min-height: 88px; border: 1px solid #333; }
    .quote-brand { display: grid; place-items: center; height: 100%; min-height: 80px; padding: 4px; }
    .quote-logo-image { width: 100%; max-width: 135px; height: 78px; object-fit: contain; }
    .quote-logo-fallback { display: none; place-items: center; width: 48px; height: 48px; border-radius: 50%; color: #fff; background: #315ee8; font-size: 20px; font-weight: 800; }
    .quote-logo-image.failed + .quote-logo-fallback { display: grid; }
    .quote-seller { min-width: 0; padding: 7px 9px 7px 0; text-align: center; }
    .quote-seller h2 { margin: 0; font-size: 15px; line-height: 1.25; font-weight: 800; overflow-wrap: anywhere; }
    .quote-seller p { margin: 3px 0 0; color: #222; font-size: 9px; line-height: 1.35; white-space: pre-line; }
    .quote-band { padding: 4px 6px; border: 1px solid #333; border-top: 0; color: #111; background: #bfd2e7; text-align: center; font-family: Georgia, "Times New Roman", serif; font-size: 21px; line-height: 1.15; font-weight: 800; letter-spacing: .4px; }
    .quote-meta { display: grid; grid-template-columns: minmax(0, 1fr); }
    .quote-meta-row { display: grid; grid-template-columns: 26% minmax(0, 1fr); min-height: 21px; border: 1px solid #444; border-top: 0; color: #222; font-size: 9px; line-height: 1.35; }
    .quote-meta-label { padding: 3px 5px; font-weight: 700; }
    .quote-meta-row strong { padding: 3px 5px; border-left: 1px solid #444; font-size: 9px; text-align: left; overflow-wrap: anywhere; }
    .quote-items { width: 100%; margin-top: 0; border-collapse: collapse; table-layout: fixed; }
    .quote-items th, .quote-items td { border: 1px solid #444; }
    .quote-items thead { color: #111; background: #bfd2e7; }
    .quote-items th { padding: 5px 4px; font-size: 8.5px; line-height: 1.1; text-align: left; font-weight: 800; }
    .quote-items td { min-height: 25px; padding: 5px 4px; color: #171717; font-size: 9px; line-height: 1.2; vertical-align: middle; overflow-wrap: anywhere; }
    .quote-items td strong { display: block; color: #171717; font-size: 9px; line-height: 1.25; }
    .quote-items td small { display: block; margin-top: 2px; color: #333; font-size: 8px; line-height: 1.25; white-space: pre-line; }
    .quote-items .align-right { text-align: right; }
    .quote-items .align-center { text-align: center; }
    .quote-items .align-middle { vertical-align: middle; }
    .quote-item-image-box { width: 100%; max-width: 180px; height: 122px; display: grid; place-items: center; margin: 0 auto; overflow: hidden; border: 1px solid #d3d7dc; border-radius: 2px; background: #fff; color: #9aa0a8; font-size: 9px; }
    .quote-item-image-box img { display: block; width: 100%; height: 100%; object-fit: contain; }
    .quote-items .quote-summary-row td { padding: 3px 4px; font-size: 8px; line-height: 1.1; }
    .quote-items .quote-grand-row td { background: #bfd2e7; font-weight: 800; }
    .quote-items .quote-grand-row td:first-child { text-align: left; }
    .quote-terms { margin-top: 12px; color: #171717; }
    .quote-terms h3 { margin: 0 0 4px; color: #171717; font-size: 8.5px; font-weight: 500; }
    .quote-terms ol { margin: 0; padding-left: 15px; color: #171717; font-size: 8px; line-height: 1.45; }
    .terms-toggle { display: inline-flex; align-items: center; gap: 9px; min-height: 36px; color: var(--ink); font-size: 12px; font-weight: 650; cursor: pointer; }
    .terms-toggle input { width: 17px; height: 17px; accent-color: var(--blue); }
    .quote-note { margin: 8px 0 0; padding-top: 6px; border-top: 1px solid #888; color: #333; font-size: 8px; line-height: 1.35; white-space: pre-line; }
    .empty-state { padding: 46px 20px; border: 1px dashed #d6deeb; border-radius: 13px; color: var(--muted); text-align: center; background: #fff; }
    .empty-icon { width: 45px; height: 45px; display: grid; place-items: center; margin: 0 auto 13px; border-radius: 13px; color: var(--blue); background: var(--blue-pale); font-size: 22px; }
    .empty-state strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 14px; }
    .empty-state p { margin: 0 auto 15px; max-width: 340px; font-size: 12px; line-height: 1.55; }
    .library-toolbar { display: flex; gap: 10px; margin-bottom: 14px; }
    .library-toolbar input { max-width: 390px; }
    .quote-list { display: grid; gap: 10px; }
    .quote-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 15px 17px; }
    .quote-row-main { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .quote-row-icon { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 11px; color: var(--blue); background: var(--blue-pale); font-size: 17px; flex: none; }
    .quote-row-title { overflow: hidden; font-size: 12px; font-weight: 750; text-overflow: ellipsis; white-space: nowrap; }
    .quote-row-sub { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .quote-row-total { margin-left: auto; color: #33435d; font-size: 12px; font-weight: 750; white-space: nowrap; }
    .quote-row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex: 1 1 100%; flex-wrap: wrap; }

  <script>
    (function () {
      'use strict';

      var storageKey = 'quotedesk-data-v1';
      var authLocalKey = 'quotedesk-login-persist-v1';
      var authSessionKey = 'quotedesk-login-session-v1';
      var adminUserId = 'admin';
      var adminPassword = 'SchoolDecor@2026!';
      var applicationStarted = false;
      var view = 'new';
      var currentMobileTab = 'editor';
      var cloudApiUrl = (window.location.hostname === 'quote.schooldecor.in' || window.location.hostname.includes('vercel.app'))
        ? '/api/quotes'
        : 'https://quote.schooldecor.in/api/quotes';
      var cloudSyncInProgress = false;

      function setCloudStatus(status) {
        var el = document.getElementById('cloud-status');
        if (!el) return;
        var dot = el.querySelector('.local-dot');
        var text = el.querySelector('span:last-child');
        if (status === 'syncing') {
          if (dot) dot.style.background = '#f59e0b';
          if (text) text.textContent = 'Syncing with server...';
        } else if (status === 'online') {
          if (dot) dot.style.background = '#18855b';
          if (text) text.innerHTML = 'Cloud synced &bull; Saved on server';
        } else {
          if (dot) dot.style.background = '#8893a7';
          if (text) text.textContent = 'Saved on this device (offline)';
        }
      }

      function cloudSync(callback) {
        if (cloudSyncInProgress) return;
        cloudSyncInProgress = true;
        setCloudStatus('syncing');
        fetch(cloudApiUrl + '?_t=' + Date.now(), { method: 'GET', cache: 'no-store' })
          .then(function (res) { return res.json(); })
          .then(function (data) {
            cloudSyncInProgress = false;
            if (data && data.ok && Array.isArray(data.quotes)) {
              var deletedList = Array.isArray(data.deletedNumbers) ? data.deletedNumbers : [];
              var serverQuotes = data.quotes.filter(function (remoteQuote) {
                return remoteQuote && remoteQuote.number && deletedList.indexOf(remoteQuote.number) === -1;
              });
              serverQuotes.sort(function (a, b) {
                return String(b.savedAt || b.date || '').localeCompare(String(a.savedAt || a.date || ''));
              });
              state.quotes = serverQuotes;

              if (state.draft && state.draft.status === 'Saved' && deletedList.indexOf(state.draft.number) !== -1) {
                state.draft = blankQuote(state.sequence, state.profile.defaultTerms);
                state.draft.currency = state.profile.currency || 'INR';
                state.sequence += 1;
                draftDirty = false;
              }

              if (data.catalog && Array.isArray(data.catalog) && data.catalog.length > (state.catalog || []).length) {
                state.catalog = data.catalog;
              }
              if (data.sequence && data.sequence > state.sequence) {
                state.sequence = data.sequence;
              }
              persist();
              updateDraftCount();
              if (view === 'saved') renderApp();
              setCloudStatus('online');
            } else {
              setCloudStatus('online');
            }
            if (typeof callback === 'function') callback();
          })
          .catch(function (err) {
            cloudSyncInProgress = false;
            console.warn('Cloud sync error:', err);
            setCloudStatus('offline');
            if (typeof callback === 'function') callback();
          });
      }

      function cloudSaveQuote(quote) {
        setCloudStatus('syncing');
        fetch(cloudApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            quote: quote,
            catalog: state.catalog,
            sequence: state.sequence
          })
        })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          if (data && data.ok) {
            setCloudStatus('online');
            showToast('Quotation saved to server database.');
            if (Array.isArray(data.quotes)) {
              var deletedList = Array.isArray(data.deletedNumbers) ? data.deletedNumbers : [];
              state.quotes = data.quotes.filter(function (q) {
                return q && q.number && deletedList.indexOf(q.number) === -1;
              });
              persist();
              updateDraftCount();
              if (view === 'saved') renderApp();
            }
          }
        })
        .catch(function (err) {
          console.warn('Cloud save error:', err);
          setCloudStatus('offline');
        });
      }

      function cloudDeleteQuote(number, callback) {
        setCloudStatus('syncing');
        fetch(cloudApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'delete', number: number })
        })
        .then(function (res) { return res.json(); })
        .then(function (data) {
          setCloudStatus('online');
          if (data && data.ok && Array.isArray(data.quotes)) {
            var deletedList = Array.isArray(data.deletedNumbers) ? data.deletedNumbers : [];
            state.quotes = data.quotes.filter(function (q) {
              return q && q.number && deletedList.indexOf(q.number) === -1;
            });
            persist();
            updateDraftCount();
            if (view === 'saved') renderApp();
          }
          if (typeof callback === 'function') callback(true);
        })
        .catch(function (err) {
          console.warn('Cloud delete error:', err);
          setCloudStatus('offline');
          if (typeof callback === 'function') callback(false);
        });
      }

      function setMobileTab(tab) {
        currentMobileTab = tab;
        var workbench = document.querySelector('.workbench');
        if (workbench) {
          workbench.classList.remove('mobile-tab-editor', 'mobile-tab-preview', 'mobile-tab-both');
          workbench.classList.add('mobile-tab-' + tab);
        }
        document.querySelectorAll('[data-mobile-tab]').forEach(function (btn) {
          btn.classList.toggle('active', btn.getAttribute('data-mobile-tab') === tab);
        });
        var floatBar = document.getElementById('mobile-floating-bar');
        if (floatBar) {
          if (tab === 'preview') {
            floatBar.style.display = 'none';
          } else {
            floatBar.style.display = '';
          }
        }
      }
      var draftDirty = false;
      var draftPersistTimer = null;
      var toastTimer;
      var productPickerActiveIndex = 0;
      var dataStoreReady = false;
      var dataStorePending = false;
      var dataStoreTimer = null;
      var dataStoreQueue = Promise.resolve();
      var dataStoreRevision = 0;
      var dataStoreInfo = null;
      var dataStoreHeartbeat = null;
      var pdfSaving = false;
      var dataStorePort = Number(new URLSearchParams(window.location.search).get('port')) || 0;

      if (isDraftQuote(state.draft, state.quotes)) state.draft.status = 'Draft';

      function todayString() {
        var now = new Date();
        return now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
      }

      function makeNumber(sequence) {
        return 'QT-' + new Date().getFullYear() + '-' + String(sequence).padStart(3, '0');
      }

      function blankItem() {
        return { code: '', name: '', spec: '', qty: '', rate: '', gstRate: '', discount: '', discountType: 'percent' };
      }

      function blankQuote(sequence, terms) {
        return {
          number: makeNumber(sequence),
          date: todayString(),
          validUntil: '',
          currency: 'INR',
          customer: { name: '', company: '', address: '', phone: '', email: '', gstin: '' },
          items: [blankItem()],
          discount: '',
          discountType: 'amount',
          freight: '',
          taxMode: 'product',
          tax: '',
          taxRate: 18,
          otherLabel: '',
          other: '',
          note: '',
          includeTerms: true,
          terms: terms == null ? defaultTerms : terms
        };
      }

      function sampleQuote() {
        return blankQuote(1, businessDefaults.defaultTerms);
      }

      function starterCatalog() {
        return [
          { code: '51107', name: 'Drum Set', spec: 'Sensory Music Park Equipment\nMin. height: 23 inch, Max. height: 34 inch, Width: 6-16 inch', rate: 51107, gstRate: '', image: sampleImages.drum },
          { code: '55000', name: 'Xylophone', spec: 'Sensory Music Park Equipment\n30 x 27 x 38 inch', rate: 55000, gstRate: '', image: sampleImages.xylophone },
          { code: '54643', name: 'Beat Manager', spec: 'Sensory Music Park Equipment\n30 x 9 x 75 inch', rate: 54643, gstRate: '', image: sampleImages.beatManager }
        ];
      }

      function normalizeCatalogText(value) {
        return String(value == null ? '' : value).trim().toLocaleLowerCase().replace(/\s+/g, ' ');
      }

      function catalogIdentity(item) {
        var code = normalizeCatalogText(item && item.code);
        var name = normalizeCatalogText(item && item.name);
        return code ? 'code:' + code : (name ? 'name:' + name : '');
      }

      function collectCatalog(quotes, draft, explicitCatalog) {
        var result = [];
        function merge(item, preferred) {
          if (!item || (!String(item.code || '').trim() && !String(item.name || '').trim())) return;
          var code = normalizeCatalogText(item.code);
          var name = normalizeCatalogText(item.name);
          var index = result.findIndex(function (candidate) {
            return (code && normalizeCatalogText(candidate.code) === code) || (name && normalizeCatalogText(candidate.name) === name);
          });
          if (index < 0) {
            result.push({ code: item.code || '', name: item.name || '', spec: item.spec || '', rate: item.rate == null ? '' : item.rate, gstRate: item.gstRate == null ? '' : item.gstRate, image: item.image || '' });
            return;
          }
          var current = result[index];
          ['code', 'name', 'spec', 'image'].forEach(function (key) {
            if (item[key] && (preferred || !current[key])) current[key] = item[key];
          });
          if (item.rate != null && item.rate !== '' && (preferred || current.rate === '' || current.rate == null)) current.rate = item.rate;
          if (item.gstRate != null && item.gstRate !== '' && (preferred || current.gstRate === '' || current.gstRate == null)) current.gstRate = item.gstRate;
        }
        (quotes || []).forEach(function (quote) { (quote.items || []).forEach(function (item) { merge(item, false); }); });
        if (draft) (draft.items || []).forEach(function (item) { merge(item, false); });
        (explicitCatalog || []).forEach(function (item) { merge(item, true); });
        return result;
      }

      function findCatalogProduct(value) {
        var query = normalizeCatalogText(value);
        if (!query) return null;
        return (state.catalog || []).find(function (item) {
          return normalizeCatalogText(item.code) === query || normalizeCatalogText(item.name) === query;
        }) || null;
      }

      function catalogOptions(field) {
        return (state.catalog || []).map(function (item) {
          var value = field === 'code' ? item.code : item.name;
          if (!value) return '';
          var detail = field === 'code' ? item.name : item.code;
          var label = [detail, item.rate !== '' && item.rate != null ? money(item.rate, state.draft.currency) : '', item.gstRate !== '' && item.gstRate != null ? 'GST ' + item.gstRate + '%' : ''].filter(Boolean).join(' · ');
          return '<option value="' + escapeHtml(value) + '" label="' + escapeHtml(label) + '"></option>';
        }).join('');
      }

      function closeProductPicker() {
        var picker = document.getElementById('product-picker');
        if (picker) picker.remove();
      }

      function showProductPicker(input, queryText) {
        if (!input || !input.isConnected) return;
        var picker = document.getElementById('product-picker');
        if (!picker) {
          picker = document.createElement('div');
          picker.id = 'product-picker';
          picker.className = 'product-picker';
          picker.setAttribute('role', 'listbox');
          document.body.appendChild(picker);
        }
        var query = normalizeCatalogText(queryText);
        var matches = (state.catalog || []).map(function (item, index) { return { item: item, index: index }; }).filter(function (entry) {
          if (!query) return true;
          return [entry.item.code, entry.item.name, entry.item.spec].some(function (value) { return normalizeCatalogText(value).indexOf(query) >= 0; });
        });
        productPickerActiveIndex = 0;
        if (!state.catalog || !state.catalog.length) {
          picker.innerHTML = '<div class="product-picker-empty">Your catalog is empty.<br><button class="text-button" data-view="catalog">Add or import products</button></div>';
        } else if (!matches.length) {
          picker.innerHTML = '<div class="product-picker-empty">No matching product. Add it to the catalog to reuse its details.</div>';
        } else {
          picker.innerHTML = matches.map(function (entry, index) {
            var item = entry.item;
            var photo = item.image ? '<img src="' + escapeHtml(item.image) + '" alt="">' : '<span class="product-option-photo">▦</span>';
            var details = [item.code ? 'Code ' + item.code : '', item.spec || ''].filter(Boolean).join(' · ');
            var price = item.rate !== '' && item.rate != null ? money(item.rate, state.draft.currency) : 'Price not set';
            var gst = item.gstRate !== '' && item.gstRate != null ? 'GST ' + item.gstRate + '%' : 'GST not set';
            return '<button type="button" class="product-option' + (index === 0 ? ' active' : '') + '" role="option" aria-selected="' + (index === 0 ? 'true' : 'false') + '" data-product-select data-item-index="' + input.getAttribute('data-index') + '" data-product-index="' + entry.index + '">' +
              photo + '<span style="min-width:0"><span class="product-option-name">' + escapeHtml(item.name || item.code || 'Product') + '</span><span class="product-option-detail">' + escapeHtml(details || 'No specifications') + '</span></span><span class="product-option-price">' + escapeHtml(price) + '<span class="product-option-detail">' + escapeHtml(gst) + '</span></span></button>';
          }).join('');
        }
        var rect = input.getBoundingClientRect();
        var width = Math.min(Math.max(300, rect.width), Math.max(220, window.innerWidth - 24));
        var maxHeight = Math.min(330, Math.max(150, window.innerHeight - 28));
        var left = Math.max(12, Math.min(rect.left, window.innerWidth - width - 12));
        var top = rect.bottom + 5;
        if (top + maxHeight > window.innerHeight - 8 && rect.top > maxHeight) top = rect.top - maxHeight - 5;
        picker.style.left = left + 'px';
        picker.style.top = Math.max(8, top) + 'px';
        picker.style.width = width + 'px';
        picker.style.maxHeight = maxHeight + 'px';
      }

      function selectCatalogProduct(itemIndex, productIndex) {
        var product = (state.catalog || [])[Number(productIndex)];
        if (!product) return;
        var current = state.draft.items[Number(itemIndex)] || blankItem();
        var quantity = current.qty;
        state.draft.items[Number(itemIndex)] = Object.assign({}, current, {
          code: product.code || '',
          name: product.name || '',
          spec: product.spec || '',
          rate: product.rate == null ? '' : product.rate,
          gstRate: product.gstRate == null ? '' : product.gstRate,
          image: product.image || '',
          qty: quantity
        });
        state.draft.isSample = false;
        draftDirty = true;
        closeProductPicker();
        persist();
        renderApp();
        setTimeout(function () {
          var quantityInput = document.querySelector('[data-item-field="qty"][data-index="' + Number(itemIndex) + '"]');
          if (quantityInput) quantityInput.focus();
        }, 0);
        showToast(product.gstRate === '' || product.gstRate == null
          ? 'GST % is not set for this product. Add it in Product catalog, or enter 0 if exempt.'
          : 'Product details, price and GST added. Enter quantity.');
      }

      function highlightProductOption() {
        var options = Array.from(document.querySelectorAll('[data-product-select]'));
        options.forEach(function (option, index) {
          option.classList.toggle('active', index === productPickerActiveIndex);
          option.setAttribute('aria-selected', index === productPickerActiveIndex ? 'true' : 'false');
        });
        if (options[productPickerActiveIndex]) options[productPickerActiveIndex].scrollIntoView({ block: 'nearest' });
      }

      function learnCatalogProducts(items) {
        (items || []).forEach(function (item) {
          if (!item || (!String(item.code || '').trim() && !String(item.name || '').trim())) return;
          var found = (state.catalog || []).find(function (candidate) {
            return (item.code && normalizeCatalogText(candidate.code) === normalizeCatalogText(item.code)) ||
              (item.name && normalizeCatalogText(candidate.name) === normalizeCatalogText(item.name));
          });
          if (!found) state.catalog.push({ code: item.code || '', name: item.name || '', spec: item.spec || '', rate: item.rate == null ? '' : item.rate, gstRate: item.gstRate == null ? '' : item.gstRate, image: item.image || '' });
        });
      }

      function normalizeDraftCollections(saved) {
        if (!Array.isArray(saved.quotes)) saved.quotes = [];
        var oldDrafts = saved.quotes.filter(function (quote) { return quote.status === 'Draft'; });
        saved.quotes = saved.quotes.filter(function (quote) { return quote.status !== 'Draft'; });
        var drafts = (Array.isArray(saved.drafts) ? saved.drafts : []).concat(oldDrafts);
        var uniqueDrafts = [];
        drafts.forEach(function (quote) {
          if (!quote) return;
          quote.status = 'Draft';
          var index = uniqueDrafts.findIndex(function (candidate) { return candidate.number === quote.number; });
          if (index < 0) uniqueDrafts.push(quote);
          else if (String(quote.savedAt || '') >= String(uniqueDrafts[index].savedAt || '')) uniqueDrafts[index] = quote;
        });
        saved.drafts = uniqueDrafts;
      }

      function loadState() {
        try {
          var saved = JSON.parse(localStorage.getItem(storageKey) || 'null');
          if (saved && saved.profile && saved.quotes && saved.draft) {
            if (!Array.isArray(saved.quotes)) saved.quotes = [];
            normalizeDraftCollections(saved);
            if (!Array.isArray(saved.draft.items) || !saved.draft.items.length) saved.draft.items = [blankItem()];
            if (!saved.profile.name) Object.assign(saved.profile, businessDefaults);
            if (!saved.profile.logo || saved.profile.logo.indexOf("Schooldecor-logo.png") !== -1 || (saved.profile.logo.indexOf("http") === 0 && saved.profile.logo.indexOf(".png") !== -1) || saved.profile.logo.length < 50) saved.profile.logo = defaultLogo;
            if (!Array.isArray(saved.catalog) || !saved.catalogInitialized) {
              saved.catalog = collectCatalog(saved.quotes.concat(saved.drafts), saved.draft, Array.isArray(saved.catalog) ? saved.catalog : []);
              saved.catalogInitialized = true;
            }
            if (saved.draft.isSample || (saved.draft.customer && !saved.draft.customer.company && !saved.draft.customer.name &&
                saved.draft.items.every(function (item) { return !item.name && !number(item.rate); }))) {
              var cleanDraft = blankQuote(Number(saved.sequence) || 1, saved.profile.defaultTerms);
              cleanDraft.number = saved.draft.number || cleanDraft.number;
              cleanDraft.date = saved.draft.date || cleanDraft.date;
              cleanDraft.currency = saved.draft.currency || saved.profile.currency || 'INR';
              cleanDraft.terms = saved.draft.terms || saved.profile.defaultTerms || defaultTerms;
              cleanDraft.includeTerms = saved.draft.includeTerms !== false;
              saved.draft = cleanDraft;
            }
            saved.sequence = Number(saved.sequence) || 1;
            return saved;
          }
        } catch (error) {}
        var initial = {
          profile: Object.assign({}, businessDefaults),
          quotes: [],
          drafts: [],
          catalog: starterCatalog(),
          catalogInitialized: true,
          sequence: 1,
          draft: sampleQuote()
        };
        initial.catalog = collectCatalog(initial.quotes, initial.draft, initial.catalog);
        return initial;
      }

      function dataStoreRequest(path, method, payload) {
        if (!dataStoreBase || !dataStoreToken) return Promise.reject(new Error('Local data storage is not available.'));
        var controller = window.AbortController ? new AbortController() : null;
        var timeout = controller ? setTimeout(function () { controller.abort(); }, 12000) : null;
        return fetch(dataStoreBase + '/' + path + '?qd=' + encodeURIComponent(dataStoreToken), {
          method: method || 'GET',
          headers: method === 'POST' ? { 'Content-Type': 'text/plain;charset=UTF-8' } : {},
          body: method === 'POST' ? JSON.stringify(payload || {}) : undefined,
          cache: 'no-store',
          signal: controller ? controller.signal : undefined
        }).then(function (response) {
          return response.text().then(function (text) {
            var result = {};
            try { result = text ? JSON.parse(text) : {}; } catch (error) {}
            if (!response.ok) throw new Error(result.error || 'Could not reach the QuoteDesk data folder.');
            return result;
          });
        }).finally(function () { if (timeout) clearTimeout(timeout); });
      }

      function flushDataStore() {
        if (!dataStoreReady) return Promise.resolve(false);
        if (dataStoreTimer) { clearTimeout(dataStoreTimer); dataStoreTimer = null; }
        dataStorePending = true;
        var revision = dataStoreRevision;
        var snapshot = JSON.stringify(state);
        dataStoreQueue = dataStoreQueue.catch(function () { return false; }).then(function () {
          return dataStoreRequest('data', 'POST', JSON.parse(snapshot)).then(function () {
            if (revision === dataStoreRevision && !dataStoreTimer) dataStorePending = false;
            return true;
          });
        }).catch(function () {
          try { localStorage.setItem(storageKey, snapshot); } catch (error) {}
          return false;
        });
        return dataStoreQueue;
      }

      function normalizeSavedState(saved) {
        if (!saved || !saved.profile || !saved.draft) return null;
        saved.profile = Object.assign({}, businessDefaults, saved.profile);
        if (!saved.profile.logo || saved.profile.logo.indexOf("Schooldecor-logo.png") !== -1 || (saved.profile.logo.indexOf("http") === 0 && saved.profile.logo.indexOf(".png") !== -1) || saved.profile.logo.length < 50) saved.profile.logo = defaultLogo;
        if (!Array.isArray(saved.quotes)) saved.quotes = [];
        normalizeDraftCollections(saved);
        if (!Array.isArray(saved.draft.items) || !saved.draft.items.length) saved.draft.items = [blankItem()];
        if (!saved.draft.customer) saved.draft.customer = { name: '', company: '', address: '', phone: '', email: '', gstin: '' };
        if (!saved.draft.taxMode) saved.draft.taxMode = 'product';
        if (saved.draft.discount == null) saved.draft.discount = '';
        if (!saved.draft.discountType) saved.draft.discountType = 'amount';
        saved.draft.items.forEach(function (item) {
          if (item.gstRate == null) item.gstRate = '';
          if (item.discount == null) item.discount = '';
          if (!item.discountType) item.discountType = 'percent';
        });
        saved.quotes.concat(saved.drafts).forEach(function (quote) {
          if (!quote.customer) quote.customer = { name: '', company: '', address: '', phone: '', email: '', gstin: '' };
          if (!Array.isArray(quote.items)) quote.items = [blankItem()];
          if (!quote.taxMode) quote.taxMode = 'product';
          quote.items.forEach(function (item) {
            if (item.gstRate == null) item.gstRate = '';
            if (item.discount == null) item.discount = '';
            if (!item.discountType) item.discountType = 'percent';
          });
        });
        [saved.draft].concat(saved.quotes, saved.drafts).forEach(function (quote) {
          var hasProductGst = (quote.items || []).some(function (item) {
            return String(item.gstRate == null ? '' : item.gstRate).trim() !== '';
          });
          /* Product-level GST is the source of truth whenever product GST percentages exist. */
          if (hasProductGst) quote.taxMode = 'product';
        });
        if (!Array.isArray(saved.catalog) || !saved.catalogInitialized) {
          saved.catalog = collectCatalog(saved.quotes.concat(saved.drafts), saved.draft, Array.isArray(saved.catalog) ? saved.catalog : []);
          saved.catalogInitialized = true;
        } else {
          saved.catalog = collectCatalog(saved.quotes.concat(saved.drafts), saved.draft, saved.catalog);
        }
        saved.sequence = Number(saved.sequence) || 1;
        if (isDraftQuote(saved.draft, saved.quotes)) saved.draft.status = 'Draft';
        return saved;
      }

      function initializeDataStore() {
        if (!dataStoreBase || !dataStoreToken) return Promise.resolve(false);
        return dataStoreRequest('data', 'GET').then(function (result) {
          var loadedState = result.exists && result.state ? normalizeSavedState(result.state) : null;
          if (loadedState) state = loadedState;
          dataStoreReady = true;
          var browserState = null;
          try {
            var cachedState = localStorage.getItem(storageKey);
            if (cachedState) browserState = normalizeSavedState(JSON.parse(cachedState));
          } catch (error) {}
          if (browserState && (!loadedState || latestStateTimestamp(browserState) > latestStateTimestamp(loadedState))) {
            state = browserState;
            dataStoreReady = true;
            return flushDataStore();
          }
          return loadedState ? Promise.resolve(true) : flushDataStore();
        }).then(function (saved) {
          if (saved) {
            try { localStorage.removeItem(storageKey); } catch (error) {}
          }
          return dataStoreRequest('info', 'GET').then(function (info) { dataStoreInfo = info; }).catch(function () {});
        }).then(function () {
          if (dataStoreHeartbeat) clearInterval(dataStoreHeartbeat);
          dataStoreHeartbeat = setInterval(function () {
            dataStoreRequest('heartbeat', 'GET').catch(function () {
              dataStoreReady = false;
              if (dataStoreHeartbeat) clearInterval(dataStoreHeartbeat);
              showToast('QuoteDesk could not reach its data folder. Changes are being kept in this browser for now.');
            });
          }, 20000);
          return true;
        }).catch(function () {
          dataStoreReady = false;
          return false;
        });
      }

      function persist() {
        if (draftDirty && state.draft) {
          state.draft.status = 'Draft';
          state.draft.savedAt = new Date().toISOString();
          upsertDraft(state.draft);
        }
        updateDraftCount();
        state.clientSavedAt = new Date().toISOString();
        var snapshot = JSON.stringify(state);
        var localSaved = false;
        try {
          localStorage.setItem(storageKey, snapshot);
          localSaved = true;
        } catch (error) {}
        if (dataStoreReady) {
          dataStoreRevision += 1;
          dataStorePending = true;
          if (dataStoreTimer) clearTimeout(dataStoreTimer);
          dataStoreTimer = setTimeout(function () {
            flushDataStore().then(function (saved) {
              if (!saved) showToast('Could not save to Documents · QuoteDesk. Your changes are kept in this browser for now.');
            });
          }, 180);
          return true;
        }
        if (localSaved) return true;
        else {
          showToast('Could not save on this device. Try another browser.');
          return false;
        }
      }

      function persistDraftSoon() {
        if (draftPersistTimer) clearTimeout(draftPersistTimer);
        draftPersistTimer = setTimeout(function () {
          draftPersistTimer = null;
          persist();
        }, 120);
      }

      function persistPendingDraftNow() {
        if (!draftPersistTimer) return;
        clearTimeout(draftPersistTimer);
        draftPersistTimer = null;
        persist();
      }

      function latestStateTimestamp(saved) {
        if (!saved) return '';
        var timestamps = [saved.clientSavedAt, saved.draft && saved.draft.savedAt];
        (saved.drafts || []).forEach(function (quote) { timestamps.push(quote && quote.savedAt); });
        (saved.quotes || []).forEach(function (quote) { timestamps.push(quote && quote.savedAt); });
        return timestamps.filter(Boolean).map(String).sort().pop() || '';
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
        });
      }

      function number(value) {
        var result = parseFloat(String(value == null ? '' : value).replace(/,/g, ''));
        return Number.isFinite(result) ? Math.max(0, result) : 0;
      }

      function money(value, currency) {
        var code = currencyOptions[currency] ? currency : 'INR';
        try {
          return new Intl.NumberFormat('en-IN', { style: 'currency', currency: code, maximumFractionDigits: 2 }).format(number(value));
        } catch (error) {
          return currencyOptions[code] + number(value).toFixed(2);
        }
      }

      function formattedDate(value) {
        if (!value) return '—';
        var parts = value.split('-');
        if (parts.length !== 3) return value;
        var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
        return new Intl.DateTimeFormat('en-IN', { day: '2-digit', month: 'short', year: 'numeric' }).format(date);
      }

      function usesProductGst(quote) {
        return (quote.items || []).some(function (item) {
          return String(item.gstRate == null ? '' : item.gstRate).trim() !== '';
        });
      }

      function itemCalculations(item, quote) {
        var qty = number(item && item.qty);
        var rate = number(item && item.rate);
        var base = qty * rate;
        var discVal = number(item && item.discount);
        var discType = (item && item.discountType) || 'percent';
        var discAmount = 0;
        if (discVal > 0) {
          discAmount = discType === 'percent'
            ? Math.round((base * discVal / 100) * 100) / 100
            : discVal;
          if (discAmount > base) discAmount = base;
        }
        var taxable = Math.max(0, base - discAmount);
        var gstRate = (item && item.gstRate !== '' && item.gstRate != null) ? number(item.gstRate) : 0;
        var gstAmount = usesProductGst(quote) ? Math.round((taxable * gstRate / 100) * 100) / 100 : 0;
        var lineTotal = taxable + gstAmount;
        return {
          qty: qty,
          rate: rate,
          base: base,
          discVal: discVal,
          discType: discType,
          discAmount: discAmount,
          taxable: taxable,
          gstRate: gstRate,
          gstAmount: gstAmount,
          lineTotal: lineTotal
        };
      }

      function totals(quote) {
        var grossTotal = 0;
        var totalItemDiscount = 0;
        var itemTaxableTotal = 0;
        var productTax = 0;
        (quote.items || []).forEach(function (item) {
          var c = itemCalculations(item, quote);
          grossTotal += c.base;
          totalItemDiscount += c.discAmount;
          itemTaxableTotal += c.taxable;
          productTax += c.gstAmount;
        });
        var itemTotal = itemTaxableTotal;
        var discountType = quote.discountType || 'amount';
        var discountVal = number(quote.discount);
        var discount = 0;
        if (discountVal > 0) {
          discount = discountType === 'percent'
            ? Math.round((itemTotal * discountVal / 100) * 100) / 100
            : discountVal;
          if (discount > itemTotal) discount = itemTotal;
        }
        var discountedSubtotal = Math.max(0, itemTotal - discount);
        var tax = (quote.taxMode === 'product' || usesProductGst(quote))
          ? productTax
          : (quote.taxMode === 'percent' ? discountedSubtotal * number(quote.taxRate) / 100 : number(quote.tax));
        var freight = number(quote.freight);
        var other = number(quote.other);
        return {
          grossTotal: grossTotal,
          totalItemDiscount: totalItemDiscount,
          itemTotal: itemTotal,
          discount: discount,
          discountVal: discountVal,
          discountType: discountType,
          discountedSubtotal: discountedSubtotal,
          freight: freight,
          tax: tax,
          other: other,
          grand: discountedSubtotal + freight + tax + other
        };
      }

      function showToast(message) {
        var toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2500);
      }

      function hasQuoteContent(quote) {
        if (!quote) return false;
        var customer = quote.customer || {};
        var customerHasContent = ['name', 'company', 'address', 'phone', 'email', 'gstin'].some(function (key) { return String(customer[key] || '').trim() !== ''; });
        var itemHasContent = (quote.items || []).some(function (item) {
          return ['code', 'name', 'spec', 'qty', 'rate', 'gstRate', 'image', 'discount'].some(function (key) { return String(item[key] == null ? '' : item[key]).trim() !== ''; });
        });
        return customerHasContent || itemHasContent || number(quote.discount) > 0 || number(quote.freight) > 0 || number(quote.tax) > 0 || number(quote.other) > 0 ||
          Boolean(quote.note || quote.validUntil) || quote.includeTerms === false || (quote.terms && quote.terms !== (state.profile.defaultTerms || defaultTerms));
      }

      function quoteSignature(quote) {
        var copy = JSON.parse(JSON.stringify(quote || {}));
        delete copy.status;
        delete copy.savedAt;
        delete copy.isSample;
        return JSON.stringify(copy);
      }

      function isDraftQuote(quote, quoteList) {
        if (!quote) return false;
        if (quote.status === 'Draft') return true;
        if (quote.status === 'Saved' || !hasQuoteContent(quote)) return false;
        var saved = (quoteList || []).find(function (item) { return item.number === quote.number && item.status !== 'Draft'; });
        return !saved || quoteSignature(saved) !== quoteSignature(quote);
      }

      function getDrafts() {
        var drafts = (state.drafts || []).slice();
        if (isDraftQuote(state.draft, state.quotes)) {
          var activeIndex = drafts.findIndex(function (quote) { return quote.number === state.draft.number; });
          if (activeIndex >= 0) drafts[activeIndex] = state.draft;
          else drafts.unshift(state.draft);
        }
        return drafts.sort(function (a, b) { return String(b.savedAt || '').localeCompare(String(a.savedAt || '')); });
      }

      function upsertDraft(quote) {
        if (!Array.isArray(state.drafts)) state.drafts = [];
        var copy = JSON.parse(JSON.stringify(quote));
        copy.status = 'Draft';
        var index = state.drafts.findIndex(function (item) { return item.number === copy.number; });
        if (index >= 0) state.drafts[index] = copy;
        else state.drafts.unshift(copy);
      }

      function updateDraftCount() {
        var badge = document.getElementById('draft-count');
        if (badge) badge.textContent = String(getDrafts().length);
        var savedBadge = document.getElementById('saved-count');
        var savedList = (state.quotes || []).filter(function (q) { return q.status !== 'Draft'; });
        if (savedBadge) {
          savedBadge.textContent = String(savedList.length);
          savedBadge.style.display = savedList.length > 0 ? 'inline-block' : 'none';
        }
        var inlineSavedCount = document.querySelectorAll('.saved-count-inline');
        inlineSavedCount.forEach(function (el) { el.textContent = String(savedList.length); });
      }

      function setView(next) {
        closeProductPicker();
        view = next;
        renderApp();
      }

      function fieldsMarkup(fields, source, company) {
        return fields.map(function (field) {
          var lookupKey = field.key.split('.').pop();
          var value = source[lookupKey] == null ? '' : source[lookupKey];
          var companyAttr = company ? ' data-company="' + field.key + '"' : '';
          var bindAttr = company ? '' : ' data-bind="' + field.key + '"';
          var required = field.required ? ' required' : '';
          var inputAttrs = ' type="' + (field.type || 'text') + '"' + (field.type === 'number' ? ' min="0" step="' + (field.step || '1') + '"' : '') + (field.placeholder ? ' placeholder="' + escapeHtml(field.placeholder) + '"' : '');
          var control = field.multiline
            ? '<textarea' + companyAttr + bindAttr + ' placeholder="' + escapeHtml(field.placeholder || '') + '"' + required + '>' + escapeHtml(value) + '</textarea>'
            : '<input' + inputAttrs + companyAttr + bindAttr + ' value="' + escapeHtml(value) + '"' + required + '>';
          return '<div class="field ' + (field.full ? 'full' : '') + '"><label>' + escapeHtml(field.label) + '</label>' + control + '</div>';
        }).join('');
      }

          button.classList.toggle('active', button.getAttribute('data-view') === view);

        if (view === 'settings') page.innerHTML = renderSettings();
        if (view === 'new') renderPreview();

      function quoteItemPages(items) {
        var maxItemsPerPage = 5;
        var pages = [];
        for (var index = 0; index < items.length; index += maxItemsPerPage) {
          pages.push(items.slice(index, index + maxItemsPerPage));
        }
        return pages.length ? pages : [[]];
      }

            '<div class="quote-meta-row"><span class="quote-meta-label">Customer:</span><strong>' + escapeHtml(customerName) + (customerMeta ? '<br>' + escapeHtml(customerMeta) : '') + '</strong></div></div>' +
            '<table class="quote-items"><colgroup><col style="width:5%"><col style="width:6%"><col style="width:12%"><col style="width:14%"><col style="width:24%"><col style="width:15%"><col style="width:7%"><col style="width:8%"><col style="width:9%"></colgroup>' +
            '<thead><tr><th>S.NO.</th><th>CODE</th><th>ITEM NAME</th><th>SPECIFICATIONS</th><th>PHOTO</th><th>RATE / GST</th><th>QTY.</th><th>GST AMT</th><th>TOTAL</th></tr></thead><tbody>' + rows + finalPageRows + '</tbody></table>' + termsHtml + '</article>'
          );

      function quotePrintHtml(quote) {
        var preview = document.createElement('div');
