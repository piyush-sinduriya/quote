        return '<!doctype html><html><head><meta charset="utf-8"><base href="' + escapeHtml(baseHref) + '"><style>' + (style ? style.textContent : '') + '</style></head><body><div id="preview" class="quote-preview-pages">' + preview.innerHTML + '</div></body></html>';
      }

      function missingGstProducts(quote) {
        if (quote.taxMode !== 'product' && !usesProductGst(quote)) return [];
        return (quote.items || []).filter(function (item) {
          return (String(item.code || '').trim() || String(item.name || '').trim()) && (item.gstRate == null || String(item.gstRate).trim() === '');
        });
      }

      function pdfAscii(value) {
        var text = String(value == null ? '' : value);
        var bytes = new Uint8Array(text.length);
        for (var i = 0; i < text.length; i += 1) bytes[i] = text.charCodeAt(i) & 255;
        return bytes;
      }

      function joinPdfBytes(parts) {
        var length = parts.reduce(function (total, part) { return total + part.length; }, 0);
        var result = new Uint8Array(length);
        var offset = 0;
        parts.forEach(function (part) { result.set(part, offset); offset += part.length; });
        return result;
      }

      function dataUrlBytes(dataUrl) {
        var source = String(dataUrl || '');
        var comma = source.indexOf(',');
        if (comma < 0) throw new Error('The PDF image could not be read.');
        var binary = atob(source.slice(comma + 1));
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function canvasPdfBlob(canvases) {
        var images = canvases.map(function (canvas) {
          return { width: canvas.width, height: canvas.height, bytes: dataUrlBytes(canvas.toDataURL('image/jpeg', .92)) };
        });
        var pageCount = images.length;
        var objectCount = 2 + pageCount * 3;
        var objects = new Array(objectCount + 1);
        var pageRefs = [];
        for (var i = 0; i < pageCount; i += 1) pageRefs.push(5 + i * 3);
        objects[1] = pdfAscii('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
        objects[2] = pdfAscii('2 0 obj\n<< /Type /Pages /Kids [' + pageRefs.map(function (ref) { return ref + ' 0 R'; }).join(' ') + '] /Count ' + pageCount + ' >>\nendobj\n');
        images.forEach(function (image, index) {
          var imageRef = 3 + index * 3;
          var contentRef = imageRef + 1;
          var pageRef = imageRef + 2;
          objects[imageRef] = joinPdfBytes([
            pdfAscii(imageRef + ' 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + image.width + ' /Height ' + image.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + image.bytes.length + ' >>\nstream\n'),
            image.bytes,
            pdfAscii('\nendstream\nendobj\n')
          ]);
          var content = 'q\n612 0 0 -792 0 792 cm\n/Im' + index + ' Do\nQ\n';
          objects[contentRef] = pdfAscii(contentRef + ' 0 obj\n<< /Length ' + content.length + ' >>\nstream\n' + content + 'endstream\nendobj\n');
          objects[pageRef] = pdfAscii(pageRef + ' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im' + index + ' ' + imageRef + ' 0 R >> >> /Contents ' + contentRef + ' 0 R >>\nendobj\n');
        });
        var parts = [new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10])];
        var offsets = new Array(objectCount + 1).fill(0);
        var size = parts[0].length;
        for (var objectNumber = 1; objectNumber <= objectCount; objectNumber += 1) {
          offsets[objectNumber] = size;
          parts.push(objects[objectNumber]);
          size += objects[objectNumber].length;
        }
        var xref = 'xref\n0 ' + (objectCount + 1) + '\n0000000000 65535 f \n';
        for (var ref = 1; ref <= objectCount; ref += 1) xref += String(offsets[ref]).padStart(10, '0') + ' 00000 n \n';
        parts.push(pdfAscii(xref + 'trailer\n<< /Size ' + (objectCount + 1) + ' /Root 1 0 R >>\nstartxref\n' + size + '\n%%EOF'));
        return new Blob([joinPdfBytes(parts)], { type: 'application/pdf' });
      }

      function loadFallbackImage(source) {
        if (!/^data:image\//i.test(String(source || ''))) return Promise.resolve(null);
        return new Promise(function (resolve) {
          var image = new Image();
          image.onload = function () { resolve(image); };
          image.onerror = function () { resolve(null); };
          image.src = source;
        });
      }

      function fallbackLines(context, value, width, maxLines) {
        var words = String(value == null ? '' : value).replace(/\r/g, '').split(/\s+/).filter(Boolean);
        if (!words.length) return ['—'];
        var lines = [];
        var line = '';
        words.forEach(function (word) {
          var candidate = line ? line + ' ' + word : word;
          if (context.measureText(candidate).width <= width || !line) line = candidate;
          else { lines.push(line); line = word; }
        });
        if (line) lines.push(line);
        if (maxLines && lines.length > maxLines) {
          lines = lines.slice(0, maxLines);
          var last = lines.length - 1;
          while (lines[last].length > 1 && context.measureText(lines[last] + '…').width > width) lines[last] = lines[last].slice(0, -1);
          lines[last] += '…';
        }
        return lines;
      }

      function fallbackText(context, value, x, y, width, options) {
        options = options || {};
        var fontSize = options.size || 8;
        var lineHeight = options.lineHeight || Math.ceil(fontSize * 1.25);
        var padding = options.padding == null ? 3 : options.padding;
        context.font = (options.weight || 400) + ' ' + fontSize + 'px Arial';
        context.fillStyle = options.color || '#152238';
        var lines = fallbackLines(context, value, Math.max(4, width - padding * 2), options.maxLines);
        lines.forEach(function (line, index) {
          var left = x + padding;
          if (options.align === 'center') left = x + (width - context.measureText(line).width) / 2;
          if (options.align === 'right') left = x + width - padding - context.measureText(line).width;
          context.fillText(line, left, y + padding + fontSize + index * lineHeight);
        });
      }

      function fallbackCell(context, value, x, y, width, height, options) {
        context.strokeStyle = '#3b4654';
        context.lineWidth = .7;
        context.strokeRect(x, y, width, height);
        fallbackText(context, value, x, y + Math.max(0, (height - ((options && options.size) || 8) * 1.25) / 2 - 5), width, options || {});
      }

      function fallbackImage(context, image, x, y, width, height) {
        context.strokeStyle = '#d3d9e2';
        context.strokeRect(x, y, width, height);
        if (!image) { fallbackText(context, 'Photo', x, y + height / 2 - 9, width, { size: 7, align: 'center', color: '#77839a' }); return; }
        var ratio = Math.min((width - 4) / image.width, (height - 4) / image.height);
        var drawWidth = image.width * ratio;
        var drawHeight = image.height * ratio;
        context.drawImage(image, x + (width - drawWidth) / 2, y + (height - drawHeight) / 2, drawWidth, drawHeight);
      }

      function fallbackHeader(context, quote, pageIndex, pageCount, logo) {
        var profile = state.profile || {};
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, 612, 792);
        context.strokeStyle = '#354150';
        context.lineWidth = 1;
        context.strokeRect(16, 16, 580, 64);
        if (logo) fallbackImage(context, logo, 23, 23, 95, 50);
        else fallbackText(context, profile.name || 'Your business', 22, 34, 100, { size: 12, weight: 700, align: 'center', maxLines: 2, color: '#315ee8' });
        fallbackText(context, String(profile.name || 'Your business').toUpperCase(), 122, 25, 466, { size: 15, weight: 700, align: 'center', maxLines: 1 });
        fallbackText(context, [profile.address, profile.phone ? 'Phone: ' + profile.phone : '', profile.gstin ? 'GSTIN: ' + profile.gstin : ''].filter(Boolean).join('  |  '), 125, 45, 460, { size: 7, align: 'center', maxLines: 2, color: '#293442' });
        context.fillStyle = '#bfd2e7';
        context.fillRect(16, 80, 580, 20);
        fallbackText(context, 'QUOTATION', 16, 81, 580, { size: 15, weight: 700, align: 'center', padding: 1 });
        var customer = quote.customer || {};
        fallbackCell(context, 'Quote No:', 16, 100, 145, 17, { size: 7, weight: 700 });
        fallbackCell(context, quote.number || '—', 161, 100, 435, 17, { size: 7, weight: 700 });
        fallbackCell(context, 'Date:', 16, 117, 145, 17, { size: 7, weight: 700 });
        fallbackCell(context, formattedDate(quote.date), 161, 117, 435, 17, { size: 7 });
        fallbackCell(context, 'Customer:', 16, 134, 145, 25, { size: 7, weight: 700 });
        fallbackCell(context, customer.company || customer.name || '—', 161, 134, 435, 25, { size: 7, weight: 700, maxLines: 2 });
        fallbackText(context, 'Page ' + pageIndex + ' of ' + pageCount, 16, 770, 580, { size: 7, align: 'right', color: '#667085', padding: 0 });
      }

      function fallbackTableHeader(context, y) {
        var columns = [.05, .06, .12, .14, .24, .15, .07, .08, .09];
        var labels = ['S.NO.', 'CODE', 'ITEM NAME', 'SPECIFICATIONS', 'PHOTO', 'RATE / GST', 'QTY.', 'GST AMT', 'TOTAL'];
        var x = 16;
        context.fillStyle = '#bfd2e7';
        context.fillRect(16, y, 580, 18);
        labels.forEach(function (label, index) {
          var width = 580 * columns[index];
          fallbackCell(context, label, x, y, width, 18, { size: 6.2, weight: 700, maxLines: 2, padding: 2 });
          x += width;
        });
        return y + 18;
      }

      function fallbackItemRow(context, item, serial, y, images, quote) {
        var columns = [.05, .06, .12, .14, .24, .15, .07, .08, .09];
        var rowHeight = 88;
        var c = itemCalculations(item, quote);
        var discStr = c.discVal > 0 ? ' [Disc -' + (c.discType === 'percent' ? c.discVal + '%' : money(c.discAmount, quote.currency)) + ']' : '';
        var rateGst = money(item.rate, quote.currency) + discStr + ' GST ' + (item.gstRate === '' || item.gstRate == null ? '—' : number(item.gstRate) + '%');
        var values = [String(serial), item.code || '—', item.name || 'Item or service', item.spec || '—', '', rateGst, item.qty || '0', quote.taxMode === 'product' ? money(c.gstAmount, quote.currency) : '—', money(c.lineTotal, quote.currency)];
        var x = 16;
        values.forEach(function (value, index) {
          var width = 580 * columns[index];
          if (index === 4) {
            context.strokeStyle = '#3b4654'; context.lineWidth = .7; context.strokeRect(x, y, width, rowHeight);
            fallbackImage(context, images[item._fallbackImageIndex] || null, x + 3, y + 4, width - 6, rowHeight - 8);
          } else {
            fallbackCell(context, value, x, y, width, rowHeight, { size: index === 2 ? 7.4 : 6.8, weight: index === 2 || index === 5 ? 700 : 400, align: index === 0 || index === 1 || index === 6 ? 'center' : (index > 6 ? 'right' : 'left'), maxLines: index === 3 ? 5 : (index === 5 ? 3 : 4), padding: 3 });
          }
          x += width;
        });
        return y + rowHeight;
      }

      function fallbackSummary(context, quote, y) {
        var sum = totals(quote);
        var rows = [];
        if (sum.totalItemDiscount > 0) {
          rows.push(['Gross items total', money(sum.grossTotal, quote.currency)]);
          rows.push(['Product discounts', '-' + money(sum.totalItemDiscount, quote.currency)]);
        }
        rows.push(['Items subtotal', money(sum.itemTotal, quote.currency)]);
        if (sum.discount) {
          var discLabel = sum.discountType === 'percent' ? 'Discount (' + sum.discountVal + '%)' : 'Discount';
          rows.push([discLabel, '-' + money(sum.discount, quote.currency)]);
        }
        rows.push(['Freight', money(sum.freight, quote.currency)]);
        rows.push(['GST / tax', money(sum.tax, quote.currency)]);
        rows.push([quote.otherLabel || 'Other charges', money(sum.other, quote.currency)]);
        rows.push(['TOTAL', money(sum.grand, quote.currency)]);
        rows.forEach(function (row, index) {
          var height = index === rows.length - 1 ? 22 : 16;
          context.fillStyle = index === rows.length - 1 ? '#315ee8' : '#ffffff';
          context.fillRect(332, y, 264, height);
          fallbackCell(context, row[0], 332, y, 130, height, { size: index === rows.length - 1 ? 9 : 7.5, weight: index === rows.length - 1 ? 700 : 400, color: index === rows.length - 1 ? '#ffffff' : '#152238' });
          fallbackCell(context, row[1], 462, y, 134, height, { size: index === rows.length - 1 ? 9 : 7.5, weight: 700, align: 'right', color: index === rows.length - 1 ? '#ffffff' : '#152238' });
          y += height;
        });
        return y;
      }

      function fallbackTerms(context, quote, y) {
        if (quote.includeTerms === false) return;
        fallbackText(context, 'TERMS & CONDITIONS', 16, y, 300, { size: 8, weight: 700, padding: 0 });
        y += 13;
        String(quote.terms || '').split(/\r?\n/).map(function (item) { return item.trim(); }).filter(Boolean).forEach(function (term, index) {
          if (y > 744) return;
          context.font = '7px Arial';
          fallbackLines(context, (index + 1) + '. ' + term, 570, 2).forEach(function (line) { if (y <= 744) { context.fillStyle = '#334155'; context.fillText(line, 18, y); y += 9; } });
          y += 1;
        });
      }

      function fallbackPdfCanvas(quote, items, pageIndex, pageCount, includeSummary, includeTerms, assets) {
        var canvas = document.createElement('canvas');
        canvas.width = 1224; canvas.height = 1584;
        var context = canvas.getContext('2d');
        context.scale(2, 2);
        fallbackHeader(context, quote, pageIndex, pageCount, assets.logo);
        var y = fallbackTableHeader(context, 159);
        items.forEach(function (item) { y = fallbackItemRow(context, item, item._fallbackSerial, y, assets.images, quote); });
        if (includeSummary) y = fallbackSummary(context, quote, y + 10);
        if (includeTerms) fallbackTerms(context, quote, y + 16);
        return canvas;
      }

      function createFallbackPdfBlob(quote) {
        var printableItems = (quote.items || []).filter(function (item) { return String(item.code || '').trim() || String(item.name || '').trim() || number(item.rate) > 0; }).map(function (item, index) {
          var copy = Object.assign({}, item);
          copy._fallbackSerial = index + 1;
          copy._fallbackImageIndex = index;
          return copy;
        });
        var pages = [];
        for (var index = 0; index < printableItems.length; index += 5) pages.push(printableItems.slice(index, index + 5));
        if (!pages.length) pages.push([]);
        var needsSummaryPage = pages[pages.length - 1].length > 4;
        var totalPages = pages.length + (needsSummaryPage ? 1 : 0);
        return Promise.all([loadFallbackImage(state.profile && state.profile.logo)].concat(printableItems.map(function (item) { return loadFallbackImage(item.image); }))).then(function (loaded) {
          var assets = { logo: loaded[0], images: loaded.slice(1) };
          var canvases = pages.map(function (items, index) {
            var finalItemsPage = index === pages.length - 1;
            return fallbackPdfCanvas(quote, items, index + 1, totalPages, finalItemsPage && !needsSummaryPage, finalItemsPage && !needsSummaryPage, assets);
          });
          if (needsSummaryPage) canvases.push(fallbackPdfCanvas(quote, [], totalPages, totalPages, true, true, assets));
          return canvasPdfBlob(canvases);
        });
      }

      function downloadPdfWithoutDesktopApp(quote) {
        openPrintDialog(quote);
        return Promise.resolve();
      }

      function requestPdfBlob(quote) {
        return fetch(dataStoreBase + '/pdf-download?qd=' + encodeURIComponent(dataStoreToken), {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({ number: quote.number, html: quotePrintHtml(quote) }),
          cache: 'no-store'
        }).then(function (response) {
          if (!response.ok) return response.text().then(function (text) {
            var error = {};
            try { error = JSON.parse(text); } catch (parseError) {}
            throw new Error(error.error || 'PDF could not be created. Please try again.');
          });
          return response.blob();
        });
      }

      function triggerPdfDownload(blob, numberText) {
        var safeNumber = String(numberText || 'Quotation').replace(/[<>:"/\\|?*\x00-\x1f]/g, '-').replace(/[ .]+$/, '') || 'Quotation';
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = safeNumber + '.pdf';
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
      }

      function waitForPrintLayout(container) {
        var images = Array.prototype.slice.call(container.querySelectorAll('img'));
        return new Promise(function (resolve) {
          var finished = false;
          var complete = function () {
            if (finished) return;
            finished = true;
            requestAnimationFrame(function () { requestAnimationFrame(resolve); });
          };
          var timer = setTimeout(complete, 4500);
          if (!images.length) { clearTimeout(timer); complete(); return; }
          var remaining = images.length;
          images.forEach(function (image) {
            var loaded = function () {
              remaining -= 1;
              if (!remaining) { clearTimeout(timer); complete(); }
            };
            if (image.complete) loaded();
            else {
              image.addEventListener('load', loaded, { once: true });
              image.addEventListener('error', loaded, { once: true });
            }
          });
        });
      }

      function openPrintDialog(quote) {
        var missingGst = missingGstProducts(quote);
        if (missingGst.length) {
          showToast('GST % missing for ' + missingGst.map(function (item) { return item.name || item.code; }).join(', ') + '. Set it in Product catalog, or enter 0 if exempt.');
          return;
        }
        var previous = document.getElementById('print-preview');
        if (previous) previous.remove();
        var printPreview = document.createElement('div');
        printPreview.id = 'print-preview';
        printPreview.className = 'quote-preview-pages';
        document.body.appendChild(printPreview);
        renderPreview(quote, printPreview);
        var clearPrintPreview = function () {
          var current = document.getElementById('print-preview');
          if (current) current.remove();
        };
        window.addEventListener('afterprint', clearPrintPreview, { once: true });
        showToast('Preparing A4 print preview…');
        waitForPrintLayout(printPreview).then(function () {
          window.print();
          setTimeout(clearPrintPreview, 120000);
        });
      }

      function printQuotation() {
        saveCurrent('Saved', true);
        renderPreview();
        if (dataStoreReady) {
          flushDataStore().catch(function () {
            showToast('Quotation is saved on this device. It will sync when QuoteDesk is open again.');
          });
        }
        openPrintDialog(state.draft);
      }

      function printSavedQuote(numberText, draftOnly) {
        var quote = getQuoteForAction(numberText, draftOnly);
        if (!quote) { showToast('This quotation could not be found.'); return; }
        openPrintDialog(quote);
      }

      function downloadSavedQuote(numberText, draftOnly) {
        if (pdfSaving) return;
        var quote = getQuoteForAction(numberText, draftOnly);
        if (!quote) { showToast('This quotation could not be found.'); return; }
        var missingGst = missingGstProducts(quote);
        if (missingGst.length) {
          showToast('GST % missing for ' + missingGst.map(function (item) { return item.name || item.code; }).join(', ') + '. Set it in Product catalog, or enter 0 if exempt.');
          return;
        }
        pdfSaving = true;
        if (!dataStoreReady) {
          downloadPdfWithoutDesktopApp(quote).catch(function (error) {
            showToast(error && error.message ? error.message : 'PDF could not be downloaded. Please try again.');
          }).then(function () { pdfSaving = false; });
          return;
        }
        flushDataStore().then(function (saved) {
          if (!saved) throw new Error('The quotation data could not be saved.');
          return requestPdfBlob(quote);
        }).then(function (blob) {
          triggerPdfDownload(blob, quote.number);
          showToast('PDF downloaded. A backup is saved in Documents · QuoteDesk · PDFs.');
        }).catch(function (error) {
          return downloadPdfWithoutDesktopApp(quote).catch(function () {
            showToast(error && error.message ? error.message : 'PDF could not be downloaded. Please try again.');
          });
        }).then(function () { pdfSaving = false; });
      }

      function renderDrafts() {
        var drafts = getDrafts();
        var cards = drafts.map(function (quote) {
          var sum = totals(quote);
          var name = (quote.customer && (quote.customer.company || quote.customer.name)) || 'Quotation in progress';
          var updated = (quote.savedAt || '').slice(0, 10) || quote.date;
          return '<div class="card quote-row"><div class="quote-row-main"><div class="quote-row-icon">&#128196;</div><div style="min-width:0"><div class="quote-row-title">' + escapeHtml(quote.number || 'Draft') + '<span class="status">Draft</span></div><div class="quote-row-sub">' + escapeHtml(name) + ' &bull; ' + escapeHtml(formattedDate(updated)) + '</div></div></div><div class="quote-row-total">' + money(sum.grand, quote.currency) + '</div><div class="quote-row-actions"><button class="button small" data-action="preview-draft" data-number="' + escapeHtml(quote.number) + '">Preview</button><button class="button small" data-action="print-draft" data-number="' + escapeHtml(quote.number) + '">Print</button><button class="button small primary" data-action="open-draft" data-number="' + escapeHtml(quote.number) + '">Continue</button><button class="button small danger" data-action="delete-draft" data-number="' + escapeHtml(quote.number) + '">Delete</button></div></div>';
        }).join('');
        return '<div class="page-heading"><div><p class="eyebrow">AUTOMATICALLY SAVED</p><h1>Drafts</h1><p class="subtitle">Unfinished quotations are saved as you work, so you can continue after closing or refreshing the app.</p></div><button class="button primary" data-action="new-quote"><span>＋</span> New quotation</button></div>' +
          '<div class="library-toolbar"><input id="draft-search" type="search" placeholder="Search drafts by quote number or customer"></div>' +
          (cards ? '<div class="quote-list" id="draft-list">' + cards + '</div>' : '<div class="empty-state"><div class="empty-icon">&#128196;</div><strong>No drafts yet</strong><p>Start a quotation and it will appear here automatically until you save it.</p><button class="button primary" data-view="new">Start a quotation</button></div>');
      }

      function renderSaved() {
        var quotes = state.quotes.filter(function (quote) { return quote.status !== 'Draft'; }).slice().sort(function (a, b) { return String(b.savedAt || '').localeCompare(String(a.savedAt || '')); });

      function updatePath(object, path, value) {
        var parts = path.split('.');
        var target = object;
        for (var i = 0; i < parts.length - 1; i += 1) target = target[parts[i]];
        target[parts[parts.length - 1]] = value;
      }

      function saveCurrent(status, quiet) {
        learnCatalogProducts(state.draft.items);
        var copy = JSON.parse(JSON.stringify(state.draft));
        var saveStatus = status || 'Saved';
        copy.status = saveStatus;
        copy.savedAt = new Date().toISOString();
        if (saveStatus === 'Draft') {
          upsertDraft(copy);
        } else {
          var found = state.quotes.findIndex(function (quote) { return quote.number === copy.number; });
          if (found >= 0) state.quotes[found] = copy;
          else state.quotes.unshift(copy);
          state.drafts = (state.drafts || []).filter(function (draft) { return draft.number !== copy.number; });
        }
        state.draft.status = saveStatus;
        state.draft.savedAt = copy.savedAt;
        draftDirty = false;
        persist();
        if (saveStatus !== 'Draft') {
          cloudSaveQuote(copy);
        }
        if (!quiet) showToast(saveStatus === 'Draft' ? 'Draft saved. You can continue it anytime.' : 'Quotation saved.');
      }

      function newQuotation() {
        if (draftDirty || isDraftQuote(state.draft, state.quotes)) {
          if (!window.confirm('Start a new quotation? Your current one will be saved as a draft.')) return;
          saveCurrent('Draft', true);
        }
        state.draft = blankQuote(state.sequence, state.profile.defaultTerms);
        state.draft.currency = state.profile.currency || 'INR';
        state.draft.isSample = false;
        draftDirty = false;
        state.sequence += 1;
        persist();
        setView('new');
      }

      function startFreshQuotationAfterRefresh() {
        var previousDraft = state && state.draft;
        if (!previousDraft) return;
        var hadContent = hasQuoteContent(previousDraft);
        if (hadContent && isDraftQuote(previousDraft, state.quotes)) {
          var savedDraft = JSON.parse(JSON.stringify(previousDraft));
          savedDraft.status = 'Draft';
          savedDraft.savedAt = savedDraft.savedAt || new Date().toISOString();
          upsertDraft(savedDraft);
        }
        var nextSequence = Number(state.sequence) || 1;
        var fresh = blankQuote(nextSequence, state.profile.defaultTerms);
        fresh.currency = state.profile.currency || 'INR';
        fresh.isSample = false;
        if (hadContent) state.sequence = nextSequence + 1;
        else fresh.number = previousDraft.number || fresh.number;
        state.draft = fresh;
        draftDirty = false;
      }

      function getQuote(numberText) {
        return state.quotes.find(function (quote) { return quote.number === numberText; });
      }

      function getQuoteForAction(numberText, draftOnly) {
        if (draftOnly) {
          if (state.draft && state.draft.number === numberText && isDraftQuote(state.draft, state.quotes)) return state.draft;
          return (state.drafts || []).find(function (quote) { return quote.number === numberText; }) || null;
        }
        return getQuote(numberText);
      }

      function closeQuotePreview() {
        var modal = document.getElementById('quote-modal');
        if (modal) modal.remove();
      }

      function showQuotePreview(numberText, draftOnly) {
        var quote = getQuoteForAction(numberText, draftOnly);
        if (!quote) { showToast('This quotation could not be found.'); return; }
        closeQuotePreview();
        var modal = document.createElement('div');
        modal.className = 'quote-modal';
        modal.id = 'quote-modal';
        modal.innerHTML = '<div class="quote-modal-panel"><div class="quote-modal-toolbar"><strong>Quotation preview · ' + escapeHtml(quote.number) + '</strong><div class="quote-modal-actions"><button class="button small primary" data-action="' + (draftOnly ? 'print-draft' : 'print-quote') + '" data-number="' + escapeHtml(quote.number) + '">Print</button><button class="button small" data-action="close-preview">Close</button></div></div><div id="saved-preview" class="quote-preview-pages"></div></div>';
        modal.addEventListener('mousedown', function (event) { if (event.target === modal) closeQuotePreview(); });
        document.body.appendChild(modal);
        renderPreview(quote, document.getElementById('saved-preview'));
      }

      function downloadBackup() {
        var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'quotedesk-backup-' + todayString() + '.json';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        showToast('Backup downloaded.');
      }

      function downloadCatalogCsv() {
        var rows = [['code', 'name', 'spec', 'rate', 'gstRate']].concat((state.catalog || []).filter(function (item) { return item.code || item.name; }).map(function (item) {
          return [item.code || '', item.name || '', item.spec || '', item.rate == null ? '' : item.rate, item.gstRate == null ? '' : item.gstRate];
        }));
        var csv = rows.map(function (row) {
          return row.map(function (cell) { return '"' + String(cell == null ? '' : cell).replace(/"/g, '""') + '"'; }).join(',');
        }).join('\r\n');
        var blob = new Blob(['\ufeff', csv], { type: 'text/csv;charset=utf-8' });
        var link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'quotedesk-product-catalog-' + todayString() + '.csv';
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(link.href);
        showToast('Product catalog downloaded.');
      }

      function parseCsvRows(text) {
        var rows = [];
        var row = [];
        var cell = '';
        var quoted = false;
        for (var i = 0; i < text.length; i += 1) {
          var char = text[i];
          if (char === '"' && quoted && text[i + 1] === '"') { cell += '"'; i += 1; }
          else if (char === '"') quoted = !quoted;
          else if (char === ',' && !quoted) { row.push(cell); cell = ''; }
          else if ((char === '\n' || char === '\r') && !quoted) {
            if (char === '\r' && text[i + 1] === '\n') i += 1;
            row.push(cell); cell = '';
            if (row.some(function (part) { return String(part).trim(); })) rows.push(row);
            row = [];
          } else cell += char;
        }
        row.push(cell);
        if (row.some(function (part) { return String(part).trim(); })) rows.push(row);
        return rows;
      }

      function importCatalogCsv(text) {
        var rows = parseCsvRows(String(text || '').replace(/^\uFEFF/, ''));
        if (rows.length < 2) { showToast('The CSV has no product rows.'); return; }
        var headers = rows.shift().map(normalizeCatalogText);
        function column(names) { return headers.findIndex(function (header) { return names.indexOf(header) >= 0; }); }
        var codeColumn = column(['code', 'product code', 'item code', 'sku', 'item number']);
        var nameColumn = column(['name', 'product', 'product name', 'item', 'item name']);
        var specColumn = column(['spec', 'specification', 'specifications', 'description', 'details']);
        var rateColumn = column(['rate', 'price', 'unit price', 'selling price', 'amount', 'mrp']);
        var gstColumn = column(['gst', 'gst%', 'gst %', 'gstrate', 'gst rate', 'tax%', 'tax rate']);
        if (codeColumn < 0 && nameColumn < 0) { showToast('CSV needs a code or product name column.'); return; }
        var importedCount = 0;
        rows.forEach(function (cells) {
          var code = codeColumn < 0 ? '' : String(cells[codeColumn] || '').trim();
          var name = nameColumn < 0 ? '' : String(cells[nameColumn] || '').trim();
          if (!code && !name) return;
          var spec = specColumn < 0 ? '' : String(cells[specColumn] || '').trim();
          var rawRate = rateColumn < 0 ? '' : String(cells[rateColumn] || '').replace(/[₹$€£,\s]/g, '').trim();
          var parsedRate = rawRate === '' ? '' : Number(rawRate);
          if (rawRate !== '' && !Number.isFinite(parsedRate)) return;
          var rawGst = gstColumn < 0 ? '' : String(cells[gstColumn] || '').replace(/[%\s]/g, '').trim();
          var parsedGst = rawGst === '' ? '' : Number(rawGst);
          if (rawGst !== '' && (!Number.isFinite(parsedGst) || parsedGst < 0 || parsedGst > 100)) return;
          var existing = (state.catalog || []).find(function (item) {
            return (code && normalizeCatalogText(item.code) === normalizeCatalogText(code)) ||
              (name && normalizeCatalogText(item.name) === normalizeCatalogText(name));
          });
          if (existing) {
            if (code) existing.code = code;
            if (name) existing.name = name;
            if (spec) existing.spec = spec;
            if (parsedRate !== '') existing.rate = parsedRate;
            if (parsedGst !== '') existing.gstRate = parsedGst;
          } else state.catalog.push({ code: code, name: name, spec: spec, rate: parsedRate, gstRate: parsedGst, image: '' });
          importedCount += 1;
        });
        persist();
        renderApp();
        showToast(importedCount ? importedCount + ' product(s) imported.' : 'No valid product rows found.');
      }

      document.addEventListener('input', function (event) {
        var target = event.target;
        if (target.id === 'quote-search') {
          var search = target.value.trim().toLowerCase();
          var list = document.getElementById('quote-list');
          if (list) list.querySelectorAll('.quote-row').forEach(function (row) {
            row.style.display = row.textContent.toLowerCase().indexOf(search) >= 0 ? '' : 'none';
          });
          return;
        }
        if (target.id === 'draft-search') {
          var draftSearch = target.value.trim().toLowerCase();
          var draftList = document.getElementById('draft-list');
          if (draftList) draftList.querySelectorAll('.quote-row').forEach(function (row) {
            row.style.display = row.textContent.toLowerCase().indexOf(draftSearch) >= 0 ? '' : 'none';
          });
          return;
        }
        if (target.id === 'catalog-search') {
          var catalogQuery = target.value.trim().toLowerCase();
          document.querySelectorAll('[data-catalog-row]').forEach(function (row) {
            var rowValues = Array.from(row.querySelectorAll('input')).map(function (input) { return input.value; }).join(' ');
            row.style.display = (row.textContent + ' ' + rowValues).toLowerCase().indexOf(catalogQuery) >= 0 ? '' : 'none';
          });
          return;
        }
        if (target.hasAttribute('data-item-field')) {
          var itemField = target.getAttribute('data-item-field');
          var itemIdx = Number(target.getAttribute('data-index'));
          if (state.draft.items[itemIdx]) state.draft.items[itemIdx][itemField] = target.value;
          draftDirty = true;
          persist();
          if (itemField === 'discountType') {
            renderApp();
            return;
          }
          if (view === 'new') renderPreview();
        }
        if (target.hasAttribute('data-company')) {
          state.profile[target.getAttribute('data-company')] = target.value;
          persist();
          return;
        }
        if (target.hasAttribute('data-catalog-field')) {
          var catalogIndex = Number(target.getAttribute('data-index'));
          var catalogField = target.getAttribute('data-catalog-field');
          if (state.catalog[catalogIndex]) state.catalog[catalogIndex][catalogField] = target.value;
          persist();
          return;
        }
        if (target.hasAttribute('data-item-field')) {
          var index = Number(target.getAttribute('data-index'));
          var field = target.getAttribute('data-item-field');
          if (state.draft.items[index]) state.draft.items[index][field] = target.value;
          draftDirty = true;
          state.draft.isSample = false;
          if (target.hasAttribute('data-catalog-search')) showProductPicker(target, target.value);
        } else if (target.hasAttribute('data-bind')) {
          var bindPath = target.getAttribute('data-bind');
          updatePath(state.draft, bindPath, target.type === 'checkbox' ? target.checked : target.value);
          draftDirty = true;
          state.draft.isSample = false;
          if (bindPath === 'taxMode' || bindPath === 'discountType') {
            persist();
            renderApp();
            return;
          }
          if (bindPath === 'currency') {
            persist();
            renderApp();
            return;
          }
        } else {
          return;
        }
        if (view === 'new') renderPreview();
        persistDraftSoon();
      });

      document.addEventListener('focusin', function (event) {
        if (event.target.hasAttribute && event.target.hasAttribute('data-catalog-search')) showProductPicker(event.target, '');
        else closeProductPicker();
      });

      document.addEventListener('mousedown', function (event) {
        if (event.target.closest && event.target.closest('#product-picker')) { event.preventDefault(); return; }
        if (!(event.target.closest && event.target.closest('[data-catalog-search]'))) closeProductPicker();
      });

      document.addEventListener('keydown', function (event) {
        if (!(event.target.hasAttribute && event.target.hasAttribute('data-catalog-search'))) return;
        var options = Array.from(document.querySelectorAll('[data-product-select]'));
        if (event.key === 'Escape') { closeProductPicker(); return; }
        if (!options.length) return;
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          productPickerActiveIndex = (productPickerActiveIndex + (event.key === 'ArrowDown' ? 1 : options.length - 1)) % options.length;
          highlightProductOption();
        } else if (event.key === 'Enter') {
          event.preventDefault();
          var option = options[productPickerActiveIndex] || options[0];
          selectCatalogProduct(option.getAttribute('data-item-index'), option.getAttribute('data-product-index'));
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeQuotePreview();
      });

      window.addEventListener('resize', closeProductPicker);

      document.addEventListener('change', function (event) {
        var target = event.target;
        if (target.hasAttribute('data-catalog-image')) {
          var catalogImage = target.files && target.files[0];
          var catalogImageIndex = Number(target.getAttribute('data-index'));
          if (!catalogImage || !state.catalog[catalogImageIndex]) return;
          var catalogImageReader = new FileReader();
          catalogImageReader.onload = function () {
            state.catalog[catalogImageIndex].image = catalogImageReader.result;
            persist();
            renderApp();
            showToast('Product photo saved to the catalog.');
          };
          catalogImageReader.readAsDataURL(catalogImage);
          return;
        }
        if (target.hasAttribute('data-item-field') && (target.getAttribute('data-item-field') === 'code' || target.getAttribute('data-item-field') === 'name')) {
          var itemIndex = Number(target.getAttribute('data-index'));
          var currentItem = state.draft.items[itemIndex];
          var changedItemField = target.getAttribute('data-item-field');
          var matchedProduct = currentItem && findCatalogProduct(target.value);
          if (matchedProduct) {
            var matchedIndex = state.catalog.indexOf(matchedProduct);
            selectCatalogProduct(itemIndex, matchedIndex);
            return;
          }
          if (currentItem) {
            var previousProduct = findCatalogProduct(changedItemField === 'code' ? currentItem.name : currentItem.code);
            if (previousProduct) {
              currentItem.code = changedItemField === 'code' ? target.value : '';
              currentItem.name = changedItemField === 'name' ? target.value : '';
              currentItem.spec = '';
              currentItem.rate = '';
              currentItem.gstRate = '';
              currentItem.image = '';
              state.draft.isSample = false;
              draftDirty = true;
              persist();
              renderApp();
              showToast('That product is not in the catalog. Add its details or import it first.');
              return;
            }
          }
        }
        if (target.id === 'logo-file') {
          var logoFile = target.files && target.files[0];
          if (!logoFile) return;
          var logoReader = new FileReader();
          logoReader.onload = function () {
            state.profile.logo = logoReader.result;
            persist();
            renderApp();
            showToast('Business logo updated.');
          };
          logoReader.readAsDataURL(logoFile);
          return;
        }
        if (target.hasAttribute('data-item-image')) {
          var itemFile = target.files && target.files[0];
          var imageIndex = Number(target.getAttribute('data-index'));
          if (!itemFile || !state.draft.items[imageIndex]) return;
          var imageReader = new FileReader();
          imageReader.onload = function () {
            state.draft.items[imageIndex].image = imageReader.result;
            state.draft.isSample = false;
            draftDirty = true;
            persist();
            renderApp();
            showToast('Item image added. It fits inside the photo box.');
          };
          imageReader.readAsDataURL(itemFile);
          return;
        }
        if (target.hasAttribute('data-company')) {
          state.profile[target.getAttribute('data-company')] = target.value;
          persist();
          return;
        }
        if (target.hasAttribute('data-bind')) {
          var bindPath = target.getAttribute('data-bind');
          updatePath(state.draft, bindPath, target.type === 'checkbox' ? target.checked : target.value);
          draftDirty = true;
          persist();
          if (bindPath === 'date' || bindPath === 'validUntil' || bindPath === 'includeTerms' || bindPath === 'discount' || bindPath === 'discountType' || bindPath === 'freight' || bindPath === 'tax' || bindPath === 'taxRate' || bindPath === 'other') renderPreview();
        }
      });

      document.addEventListener('click', function (event) {
        var mobileTabBtn = event.target.closest('[data-mobile-tab]');
        if (mobileTabBtn) {
          setMobileTab(mobileTabBtn.getAttribute('data-mobile-tab'));
          return;
        }
        var switchAction = event.target.closest('[data-action="switch-to-preview"]');
        if (switchAction) {
          setMobileTab('preview');
          var p = document.querySelector('.preview-wrap');
          if (p) p.scrollIntoView({ behavior: 'smooth' });
          return;
        }
        var switchBack = event.target.closest('[data-action="switch-to-editor"]');
        if (switchBack) {
          setMobileTab('editor');
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        var productOption = event.target.closest('[data-product-select]');
        if (productOption) {
          selectCatalogProduct(productOption.getAttribute('data-item-index'), productOption.getAttribute('data-product-index'));
          return;
        }
        var catalogSearchInput = event.target.closest('[data-catalog-search]');
        if (catalogSearchInput) {
          showProductPicker(catalogSearchInput, '');
          return;
        }
        var viewButton = event.target.closest('[data-view]');
        if (viewButton) {
          setView(viewButton.getAttribute('data-view'));
          return;
        }
        var button = event.target.closest('[data-action]');
        if (!button) return;
        var action = button.getAttribute('data-action');
        if (action === 'logout') { logOut(); return; }
        if (action === 'new-quote') newQuotation();
        if (action === 'refresh-cloud') {
          showToast('Syncing with server...');
          cloudSync(function () {
            renderApp();
            showToast('Saved quotations up to date.');
          });
          return;
        }
        if (action === 'preview-quote') showQuotePreview(button.getAttribute('data-number'), false);
        if (action === 'preview-draft') showQuotePreview(button.getAttribute('data-number'), true);
        if (action === 'print-quote') printSavedQuote(button.getAttribute('data-number'), false);
        if (action === 'print-draft') printSavedQuote(button.getAttribute('data-number'), true);
        if (action === 'close-preview') closeQuotePreview();
        if (action === 'open-draft') {
          var draftToOpen = getQuoteForAction(button.getAttribute('data-number'), true);
          if (draftToOpen) {
            state.draft = JSON.parse(JSON.stringify(draftToOpen));
            state.draft.status = 'Draft';
            draftDirty = false;
            persist();
            setView('new');
          }
        }
        if (action === 'delete-draft') {
          var draftNumberToDelete = button.getAttribute('data-number');
          if (window.confirm('Delete draft ' + draftNumberToDelete + '?')) {
            var activeDraftSelected = state.draft.number === draftNumberToDelete && isDraftQuote(state.draft, state.quotes);
            var savedVersion = state.quotes.find(function (quote) { return quote.number === draftNumberToDelete && quote.status !== 'Draft'; });
            state.drafts = (state.drafts || []).filter(function (quote) { return quote.number !== draftNumberToDelete; });
            if (activeDraftSelected) {
              if (savedVersion) {
                state.draft = JSON.parse(JSON.stringify(savedVersion));
                delete state.draft.status;
                delete state.draft.savedAt;
              } else {
                state.draft = blankQuote(state.sequence, state.profile.defaultTerms);
                state.draft.currency = state.profile.currency || 'INR';
                state.sequence += 1;
              }
              draftDirty = false;
            }
            persist();
            renderApp();
            showToast('Draft deleted.');
          }
        }
        if (action === 'add-catalog') {
          state.catalog.unshift({ code: '', name: '', spec: '', rate: '', gstRate: '', image: '' });
          persist();
          setView('catalog');
        }
        if (action === 'open-data-folder') {
          dataStoreRequest('open-folder', 'POST', {}).then(function () { showToast('QuoteDesk folders opened.'); }).catch(function () { showToast('Could not open the QuoteDesk folder.'); });
        }
        if (action === 'remove-catalog') {
          var catalogRemoveIndex = Number(button.getAttribute('data-index'));
          if (state.catalog[catalogRemoveIndex] && window.confirm('Remove this product from the catalog?')) {
            state.catalog.splice(catalogRemoveIndex, 1);
            persist();
            renderApp();
            showToast('Product removed from the catalog.');
          }
        }
        if (action === 'add-item') {
          state.draft.items.push(blankItem());
          persist();
          renderApp();
        }
        if (action === 'remove-item') {
          var removeIndex = Number(button.getAttribute('data-index'));
          if (state.draft.items.length > 1) state.draft.items.splice(removeIndex, 1);
          else state.draft.items[0] = blankItem();
          persist();
          renderApp();
        }
        if (action === 'save-quote') {
          saveCurrent('Saved');
          setView('saved');
        }
        if (action === 'save-and-print') {
          saveCurrent('Saved');
          printQuotation();
        }
        if (action === 'save-settings') {
          persist();
          showToast('Business details saved.');
          setView('new');
        }
        if (action === 'reset-logo') {
          state.profile.logo = defaultLogo;
          persist();
          renderApp();
          showToast('Attached School Decor logo restored.');
        }
        if (action === 'print') {
          if (view !== 'new') setView('new');
          setTimeout(printQuotation, 80);
        }
        if (action === 'open-quote') {
          var quoteToOpen = getQuote(button.getAttribute('data-number'));
          if (quoteToOpen) {
            state.draft = JSON.parse(JSON.stringify(quoteToOpen));
            delete state.draft.status;
            delete state.draft.savedAt;
            draftDirty = false;
            persist();
            setView('new');
          }
        }
        if (action === 'duplicate-quote') {
          var quoteToCopy = getQuote(button.getAttribute('data-number'));
          if (quoteToCopy) {
            state.draft = JSON.parse(JSON.stringify(quoteToCopy));
            state.draft.number = makeNumber(state.sequence);
            state.draft.date = todayString();
            state.draft.isSample = false;
            delete state.draft.status;
            delete state.draft.savedAt;
            draftDirty = true;
            state.sequence += 1;
            persist();
            setView('new');
            showToast('Copy created. Update the details and save.');
          }
        }
        if (action === 'delete-quote') {
          var deleteNumber = button.getAttribute('data-number');
          if (window.confirm('Delete quotation ' + deleteNumber + ' permanently from server?')) {
            state.quotes = state.quotes.filter(function (quote) { return quote.number !== deleteNumber; });
            if (state.draft.number === deleteNumber && state.draft.status === 'Saved') {
              state.draft = blankQuote(state.sequence, state.profile.defaultTerms);
              state.draft.currency = state.profile.currency || 'INR';
              state.sequence += 1;
              draftDirty = false;
            }
            persist();
            renderApp();
            showToast('Deleting quotation ' + deleteNumber + ' from server...');
            cloudDeleteQuote(deleteNumber, function (success) {
              if (success) {
                showToast('Quotation ' + deleteNumber + ' permanently deleted from server.');
              } else {
                showToast('Quotation deleted locally (server offline).');
              }
            });
          }
        }
        if (action === 'export-data') downloadBackup();
        if (action === 'import-data') document.getElementById('import-file').click();
        if (action === 'export-catalog') downloadCatalogCsv();
        if (action === 'import-catalog') document.getElementById('catalog-import-file').click();
      });

      document.getElementById('catalog-import-file').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () { importCatalogCsv(reader.result); event.target.value = ''; };
        reader.onerror = function () { showToast('This CSV file could not be read.'); event.target.value = ''; };
        reader.readAsText(file);
      });

      document.getElementById('import-file').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var imported = JSON.parse(reader.result);
            if (!imported.profile || !Array.isArray(imported.quotes) || !imported.draft) throw new Error('Invalid backup');
            if (!window.confirm('Restore this backup? It will replace the data currently saved in this browser.')) return;
            state = normalizeSavedState(imported);
            if (!state) throw new Error('Invalid backup');
            draftDirty = false;
            persist();
            setView('saved');
            showToast('Backup restored.');
          } catch (error) {
            showToast('This backup file could not be read.');
          }
          event.target.value = '';
        };
        reader.readAsText(file);
      });

      window.addEventListener('beforeprint', function () {
        if (view !== 'new') {
          view = 'new';
          renderApp();
        }
      });

      window.addEventListener('beforeunload', function () {
        persistPendingDraftNow();
        if (!dataStoreReady || !dataStorePending || !navigator.sendBeacon) return;
        var endpoint = dataStoreBase + '/data?qd=' + encodeURIComponent(dataStoreToken);
        try { navigator.sendBeacon(endpoint, new Blob([JSON.stringify(state)], { type: 'text/plain;charset=UTF-8' })); } catch (error) {}
      });

      function isAuthorizedUser(u, p) {
        var user = String(u || '').trim().toLowerCase();
        var pass = String(p || '');
        if ((user === 'admin' || user === 'piyush-sinduriya' || user === 'piyush') &&
            (pass === 'SchoolDecor@2026!' || pass === 'Piyush@8789332857' || pass === 'admin')) {
          return true;
        }
        return false;
      }

      function hasValidLogin() {
        var saved = null;
        try { saved = localStorage.getItem(authLocalKey) || sessionStorage.getItem(authSessionKey); } catch (error) {}
        try {
          var login = saved ? JSON.parse(saved) : null;
          return login && (login.user === adminUserId || String(login.user).toLowerCase() === 'piyush-sinduriya');
        } catch (error) {
          return false;
        }
      }

      function beginApplication() {
        if (applicationStarted) return;
        applicationStarted = true;
        document.body.classList.add('authenticated');
        var shell = document.querySelector('.app-shell');
        if (shell) shell.classList.add('is-authenticated');
        initializeDataStore().then(function () {
          startFreshQuotationAfterRefresh();
          persist();
          renderApp();
          cloudSync();
        });
      }

      function showLoginScreen(message) {
        document.body.classList.remove('authenticated');
        var shell = document.querySelector('.app-shell');
        if (shell) shell.classList.remove('is-authenticated');
        var error = document.getElementById('login-error');
        if (error) error.textContent = message || '';
        var userInput = document.getElementById('login-user');
        if (userInput) userInput.focus();
      }

      function logOut() {
        try {
          localStorage.removeItem(authLocalKey);
          sessionStorage.removeItem(authSessionKey);
        } catch (error) {}
        window.location.reload();
      }

      var loginForm = document.getElementById('login-form');
      if (loginForm) loginForm.addEventListener('submit', function (event) {
        event.preventDefault();
        var user = String(document.getElementById('login-user').value || '').trim();
        var password = document.getElementById('login-password').value || '';
        var remember = document.getElementById('remember-login').checked;
        if (!isAuthorizedUser(user, password)) {
          showLoginScreen('User ID or password is incorrect.');
          document.getElementById('login-password').value = '';
          return;
        }
        var session = JSON.stringify({ user: adminUserId, signedInAt: new Date().toISOString() });
        try {
          sessionStorage.setItem(authSessionKey, session);
          if (remember) localStorage.setItem(authLocalKey, session);
          else localStorage.removeItem(authLocalKey);
        } catch (error) {}
        beginApplication();
      });

      
      window.addEventListener('focus', function () {
        if (applicationStarted) cloudSync();
      });
      setInterval(function () {
        if (applicationStarted) cloudSync();
      }, 30000);

      if (hasValidLogin()) beginApplication();
      else showLoginScreen();
    }());
  </script>
</body>
</html>
