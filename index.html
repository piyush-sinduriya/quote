      function parseCsvRows(text) {
        var rows = [];
        var row = [];
        var cell = '';
        var quoted = false;
        for (var i = 0; i < text.length; i += 1) {
          var char = text[i];
          if (char === '"' && quoted && text[i + 1] === '"') { cell += '"'; i += 1; }
          else if (char === '"') quoted = !quoted;
          else if (char === ',' && !quoted) { row.push(cell); cell = ''; }
          else if ((char === '\n' || char === '\r') && !quoted) {
            if (char === '\r' && text[i + 1] === '\n') i += 1;
            row.push(cell); cell = '';
            if (row.some(function (part) { return String(part).trim(); })) rows.push(row);
            row = [];
          } else cell += char;
        }
        row.push(cell);
        if (row.some(function (part) { return String(part).trim(); })) rows.push(row);
        return rows;
      }

      function importCatalogCsv(text) {
        var rows = parseCsvRows(String(text || '').replace(/^\uFEFF/, ''));
        if (rows.length < 2) { showToast('The CSV has no product rows.'); return; }
        var headers = rows.shift().map(normalizeCatalogText);
        function column(names) { return headers.findIndex(function (header) { return names.indexOf(header) >= 0; }); }
        var codeColumn = column(['code', 'product code', 'item code', 'sku', 'item number']);
        var nameColumn = column(['name', 'product', 'product name', 'item', 'item name']);
        var specColumn = column(['spec', 'specification', 'specifications', 'description', 'details']);
        var rateColumn = column(['rate', 'price', 'unit price', 'selling price', 'amount', 'mrp']);
        var gstColumn = column(['gst', 'gst%', 'gst %', 'gstrate', 'gst rate', 'tax%', 'tax rate']);
        if (codeColumn < 0 && nameColumn < 0) { showToast('CSV needs a code or product name column.'); return; }
        var importedCount = 0;
        rows.forEach(function (cells) {
          var code = codeColumn < 0 ? '' : String(cells[codeColumn] || '').trim();
          var name = nameColumn < 0 ? '' : String(cells[nameColumn] || '').trim();
          if (!code && !name) return;
          var spec = specColumn < 0 ? '' : String(cells[specColumn] || '').trim();
          var rawRate = rateColumn < 0 ? '' : String(cells[rateColumn] || '').replace(/[₹$€£,\s]/g, '').trim();
          var parsedRate = rawRate === '' ? '' : Number(rawRate);
          if (rawRate !== '' && !Number.isFinite(parsedRate)) return;
          var rawGst = gstColumn < 0 ? '' : String(cells[gstColumn] || '').replace(/[%\s]/g, '').trim();
          var parsedGst = rawGst === '' ? '' : Number(rawGst);
          if (rawGst !== '' && (!Number.isFinite(parsedGst) || parsedGst < 0 || parsedGst > 100)) return;
          var existing = (state.catalog || []).find(function (item) {
            return (code && normalizeCatalogText(item.code) === normalizeCatalogText(code)) ||
              (name && normalizeCatalogText(item.name) === normalizeCatalogText(name));
          });
          if (existing) {
            if (code) existing.code = code;
            if (name) existing.name = name;
            if (spec) existing.spec = spec;
            if (parsedRate !== '') existing.rate = parsedRate;
            if (parsedGst !== '') existing.gstRate = parsedGst;
          } else state.catalog.push({ code: code, name: name, spec: spec, rate: parsedRate, gstRate: parsedGst, image: '' });
          importedCount += 1;
        });
        persist();
        renderApp();
        showToast(importedCount ? importedCount + ' product(s) imported.' : 'No valid product rows found.');
      }

      document.addEventListener('input', function (event) {
        var target = event.target;
        if (target.id === 'quote-search') {
          var search = target.value.trim().toLowerCase();
          var list = document.getElementById('quote-list');
          if (list) list.querySelectorAll('.quote-row').forEach(function (row) {
            row.style.display = row.textContent.toLowerCase().indexOf(search) >= 0 ? '' : 'none';
          });
          return;
        }
        if (target.id === 'draft-search') {
          var draftSearch = target.value.trim().toLowerCase();
          var draftList = document.getElementById('draft-list');
          if (draftList) draftList.querySelectorAll('.quote-row').forEach(function (row) {
            row.style.display = row.textContent.toLowerCase().indexOf(draftSearch) >= 0 ? '' : 'none';
          });
          return;
        }
        if (target.id === 'catalog-search') {
          var catalogQuery = target.value.trim().toLowerCase();
          document.querySelectorAll('[data-catalog-row]').forEach(function (row) {
            var rowValues = Array.from(row.querySelectorAll('input')).map(function (input) { return input.value; }).join(' ');
            row.style.display = (row.textContent + ' ' + rowValues).toLowerCase().indexOf(catalogQuery) >= 0 ? '' : 'none';
          });
          return;
        }
        if (target.hasAttribute('data-company')) {
          state.profile[target.getAttribute('data-company')] = target.value;
          persist();
          return;
        }
        if (target.hasAttribute('data-catalog-field')) {
          var catalogIndex = Number(target.getAttribute('data-index'));
          var catalogField = target.getAttribute('data-catalog-field');
          if (state.catalog[catalogIndex]) state.catalog[catalogIndex][catalogField] = target.value;
          persist();
          return;
        }
        if (target.hasAttribute('data-item-field')) {
          var index = Number(target.getAttribute('data-index'));
          var field = target.getAttribute('data-item-field');
          if (state.draft.items[index]) state.draft.items[index][field] = target.value;
          draftDirty = true;
          state.draft.isSample = false;
          if (target.hasAttribute('data-catalog-search')) showProductPicker(target, target.value);
        } else if (target.hasAttribute('data-bind')) {
          var bindPath = target.getAttribute('data-bind');
          updatePath(state.draft, bindPath, target.type === 'checkbox' ? target.checked : target.value);
          draftDirty = true;
          state.draft.isSample = false;
          if (bindPath === 'taxMode') {
            persist();
            renderApp();
            return;
          }
          if (bindPath === 'currency') {
            persist();
            renderApp();
            return;
          }
        } else {
          return;
        }
        if (view === 'new') renderPreview();
        persistDraftSoon();
      });

      document.addEventListener('focusin', function (event) {
        if (event.target.hasAttribute && event.target.hasAttribute('data-catalog-search')) showProductPicker(event.target, '');
        else closeProductPicker();
      });

      document.addEventListener('mousedown', function (event) {
        if (event.target.closest && event.target.closest('#product-picker')) { event.preventDefault(); return; }
        if (!(event.target.closest && event.target.closest('[data-catalog-search]'))) closeProductPicker();
      });

      document.addEventListener('keydown', function (event) {
        if (!(event.target.hasAttribute && event.target.hasAttribute('data-catalog-search'))) return;
        var options = Array.from(document.querySelectorAll('[data-product-select]'));
        if (event.key === 'Escape') { closeProductPicker(); return; }
        if (!options.length) return;
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          productPickerActiveIndex = (productPickerActiveIndex + (event.key === 'ArrowDown' ? 1 : options.length - 1)) % options.length;
          highlightProductOption();
        } else if (event.key === 'Enter') {
          event.preventDefault();
          var option = options[productPickerActiveIndex] || options[0];
          selectCatalogProduct(option.getAttribute('data-item-index'), option.getAttribute('data-product-index'));
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeQuotePreview();
      });

      window.addEventListener('resize', function () {
        closeProductPicker();
        if (view === 'new' && studioMode === 'split') {
          previewZoom = calculateFitZoom();
          applyPreviewZoom();
        }
      });

      document.addEventListener('change', function (event) {
        var target = event.target;
        if (target.hasAttribute('data-catalog-image')) {
          var catalogImage = target.files && target.files[0];
          var catalogImageIndex = Number(target.getAttribute('data-index'));
          if (!catalogImage || !state.catalog[catalogImageIndex]) return;
          var catalogImageReader = new FileReader();
          catalogImageReader.onload = function () {
            state.catalog[catalogImageIndex].image = catalogImageReader.result;
            persist();
            renderApp();
            showToast('Product photo saved to the catalog.');
          };
          catalogImageReader.readAsDataURL(catalogImage);
          return;
        }
        if (target.hasAttribute('data-item-field') && (target.getAttribute('data-item-field') === 'code' || target.getAttribute('data-item-field') === 'name')) {
          var itemIndex = Number(target.getAttribute('data-index'));
          var currentItem = state.draft.items[itemIndex];
          var changedItemField = target.getAttribute('data-item-field');
          var matchedProduct = currentItem && findCatalogProduct(target.value);
          if (matchedProduct) {
            var matchedIndex = state.catalog.indexOf(matchedProduct);
            selectCatalogProduct(itemIndex, matchedIndex);
            return;
          }
          if (currentItem) {
            var previousProduct = findCatalogProduct(changedItemField === 'code' ? currentItem.name : currentItem.code);
            if (previousProduct) {
              currentItem.code = changedItemField === 'code' ? target.value : '';
              currentItem.name = changedItemField === 'name' ? target.value : '';
              currentItem.spec = '';
              currentItem.rate = '';
              currentItem.gstRate = '';
              currentItem.image = '';
              state.draft.isSample = false;
              draftDirty = true;
              persist();
              renderApp();
              showToast('That product is not in the catalog. Add its details or import it first.');
              return;
            }
          }
        }
        if (target.id === 'logo-file') {
          var logoFile = target.files && target.files[0];
          if (!logoFile) return;
          var logoReader = new FileReader();
          logoReader.onload = function () {
            state.profile.logo = logoReader.result;
            persist();
            renderApp();
            showToast('Business logo updated.');
          };
          logoReader.readAsDataURL(logoFile);
          return;
        }
        if (target.hasAttribute('data-item-image')) {
          var itemFile = target.files && target.files[0];
          var imageIndex = Number(target.getAttribute('data-index'));
          if (!itemFile || !state.draft.items[imageIndex]) return;
          var imageReader = new FileReader();
          imageReader.onload = function () {
            state.draft.items[imageIndex].image = imageReader.result;
            state.draft.isSample = false;
            draftDirty = true;
            persist();
            renderApp();
            showToast('Item image added. It fits inside the photo box.');
          };
          imageReader.readAsDataURL(itemFile);
          return;
        }
        if (target.hasAttribute('data-company')) {
          state.profile[target.getAttribute('data-company')] = target.value;
          persist();
          return;
        }
        if (target.hasAttribute('data-bind')) {
          var bindPath = target.getAttribute('data-bind');
          updatePath(state.draft, bindPath, target.type === 'checkbox' ? target.checked : target.value);
          draftDirty = true;
          persist();
          if (bindPath === 'date' || bindPath === 'validUntil' || bindPath === 'includeTerms') renderPreview();
        }
      });

      document.addEventListener('click', function (event) {
        var productOption = event.target.closest('[data-product-select]');
        if (productOption) {
          selectCatalogProduct(productOption.getAttribute('data-item-index'), productOption.getAttribute('data-product-index'));
          return;
        }
        var catalogSearchInput = event.target.closest('[data-catalog-search]');
        if (catalogSearchInput) {
          showProductPicker(catalogSearchInput, '');
          return;
        }
        var studioModeBtn = event.target.closest('[data-studio-mode]');
        if (studioModeBtn) {
          setStudioMode(studioModeBtn.getAttribute('data-studio-mode'));
          return;
        }
        var viewButton = event.target.closest('[data-view]');
        if (viewButton) {
          setView(viewButton.getAttribute('data-view'));
          return;
        }
        var button = event.target.closest('[data-action]');
        if (!button) return;
        var action = button.getAttribute('data-action');
        if (action === 'zoom-in') {
          previewZoom = Math.min(1.5, Math.round((previewZoom + 0.05) * 100) / 100);
          applyPreviewZoom();
          return;
        }
        if (action === 'zoom-out') {
          previewZoom = Math.max(0.35, Math.round((previewZoom - 0.05) * 100) / 100);
          applyPreviewZoom();
          return;
        }
        if (action === 'zoom-fit') {
          previewZoom = calculateFitZoom();
          applyPreviewZoom();
          return;
        }
        if (action === 'new-quote') newQuotation();
        if (action === 'preview-quote') showQuotePreview(button.getAttribute('data-number'), false);
        if (action === 'preview-draft') showQuotePreview(button.getAttribute('data-number'), true);
        if (action === 'download-quote') downloadSavedQuote(button.getAttribute('data-number'), false);
        if (action === 'download-draft') downloadSavedQuote(button.getAttribute('data-number'), true);
        if (action === 'close-preview') closeQuotePreview();
        if (action === 'open-draft') {
          var draftToOpen = getQuoteForAction(button.getAttribute('data-number'), true);
          if (draftToOpen) {
            state.draft = JSON.parse(JSON.stringify(draftToOpen));
            state.draft.status = 'Draft';
            draftDirty = false;
            persist();
            setView('new');
          }
        }
        if (action === 'delete-draft') {
          var draftNumberToDelete = button.getAttribute('data-number');
          if (window.confirm('Delete draft ' + draftNumberToDelete + '?')) {
            var activeDraftSelected = state.draft.number === draftNumberToDelete && isDraftQuote(state.draft, state.quotes);
            var savedVersion = state.quotes.find(function (quote) { return quote.number === draftNumberToDelete && quote.status !== 'Draft'; });
            state.drafts = (state.drafts || []).filter(function (quote) { return quote.number !== draftNumberToDelete; });
            if (activeDraftSelected) {
              if (savedVersion) {
                state.draft = JSON.parse(JSON.stringify(savedVersion));
                delete state.draft.status;
                delete state.draft.savedAt;
              } else {
                state.draft = blankQuote(state.sequence, state.profile.defaultTerms);
                state.draft.currency = state.profile.currency || 'INR';
                state.sequence += 1;
              }
              draftDirty = false;
            }
            persist();
            renderApp();
            showToast('Draft deleted.');
          }
        }
        if (action === 'add-catalog') {
          state.catalog.unshift({ code: '', name: '', spec: '', rate: '', gstRate: '', image: '' });
          persist();
          setView('catalog');
        }
        if (action === 'open-data-folder') {
          dataStoreRequest('open-folder', 'POST', {}).then(function () { showToast('QuoteDesk folders opened.'); }).catch(function () { showToast('Could not open the QuoteDesk folder.'); });
        }
        if (action === 'remove-catalog') {
          var catalogRemoveIndex = Number(button.getAttribute('data-index'));
          if (state.catalog[catalogRemoveIndex] && window.confirm('Remove this product from the catalog?')) {
            state.catalog.splice(catalogRemoveIndex, 1);
            persist();
            renderApp();
            showToast('Product removed from the catalog.');
          }
        }
        if (action === 'add-item') {
          state.draft.items.push(blankItem());
          persist();
          renderApp();
        }
        if (action === 'remove-item') {
          var removeIndex = Number(button.getAttribute('data-index'));
          if (state.draft.items.length > 1) state.draft.items.splice(removeIndex, 1);
          else state.draft.items[0] = blankItem();
          persist();
          renderApp();
        }
        if (action === 'save-quote') {
          printQuotation();
        }
        if (action === 'save-settings') {
          persist();
          showToast('Business details saved.');
          setView('new');
        }
        if (action === 'reset-logo') {
          state.profile.logo = defaultLogo;
          persist();
          renderApp();
          showToast('Attached School Decor logo restored.');
        }
        if (action === 'print') {
          if (view !== 'new') setView('new');
          setTimeout(printQuotation, 80);
        }
        if (action === 'open-quote') {
          var quoteToOpen = getQuote(button.getAttribute('data-number'));
          if (quoteToOpen) {
            state.draft = JSON.parse(JSON.stringify(quoteToOpen));
            delete state.draft.status;
            delete state.draft.savedAt;
            draftDirty = false;
            persist();
            setView('new');
          }
        }
        if (action === 'duplicate-quote') {
          var quoteToCopy = getQuote(button.getAttribute('data-number'));
          if (quoteToCopy) {
            state.draft = JSON.parse(JSON.stringify(quoteToCopy));
            state.draft.number = makeNumber(state.sequence);
            state.draft.date = todayString();
            state.draft.isSample = false;
            delete state.draft.status;
            delete state.draft.savedAt;
            draftDirty = true;
            state.sequence += 1;
            persist();
            setView('new');
            showToast('Copy created. Update the details and save.');
          }
        }
        if (action === 'delete-quote') {
          var deleteNumber = button.getAttribute('data-number');
          if (window.confirm('Delete quotation ' + deleteNumber + '?')) {
            state.quotes = state.quotes.filter(function (quote) { return quote.number !== deleteNumber; });
            if (state.draft.number === deleteNumber && state.draft.status === 'Saved') {
              state.draft = blankQuote(state.sequence, state.profile.defaultTerms);
              state.draft.currency = state.profile.currency || 'INR';
              state.sequence += 1;
              draftDirty = false;
            }
            persist();
            renderApp();
            showToast('Quotation deleted.');
          }
        }
        if (action === 'export-data') downloadBackup();
        if (action === 'import-data') document.getElementById('import-file').click();
        if (action === 'export-catalog') downloadCatalogCsv();
        if (action === 'import-catalog') document.getElementById('catalog-import-file').click();
      });

      document.getElementById('catalog-import-file').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () { importCatalogCsv(reader.result); event.target.value = ''; };
        reader.onerror = function () { showToast('This CSV file could not be read.'); event.target.value = ''; };
        reader.readAsText(file);
      });

      document.getElementById('import-file').addEventListener('change', function (event) {
        var file = event.target.files && event.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            var imported = JSON.parse(reader.result);
            if (!imported.profile || !Array.isArray(imported.quotes) || !imported.draft) throw new Error('Invalid backup');
            if (!window.confirm('Restore this backup? It will replace the data currently saved in this browser.')) return;
            state = normalizeSavedState(imported);
            if (!state) throw new Error('Invalid backup');
            draftDirty = false;
            persist();
            setView('saved');
            showToast('Backup restored.');
          } catch (error) {
            showToast('This backup file could not be read.');
          }
          event.target.value = '';
        };
        reader.readAsText(file);
      });

      window.addEventListener('beforeprint', function () {
        if (view !== 'new') {
          view = 'new';
          renderApp();
        }
      });

      window.addEventListener('beforeunload', function () {
        persistPendingDraftNow();
        if (!dataStoreReady || !dataStorePending || !navigator.sendBeacon) return;
        var endpoint = dataStoreBase + '/data?qd=' + encodeURIComponent(dataStoreToken);
        try { navigator.sendBeacon(endpoint, new Blob([JSON.stringify(state)], { type: 'text/plain;charset=UTF-8' })); } catch (error) {}
      });

      initializeDataStore().then(function () {
        persist();
        renderApp();
      });
    }());
  </script>
</body>
</html>
